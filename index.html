const BODY_REGION = {}; BODY_REGIONS.forEach(r=>{ BODY_REGION[r.id]=r; });

// --- 2 · STIMULUS MAP ----------------------------------------------------
// What a logged session is credited with touching, and how strongly. HEBE only
// records a coarse session type, so this is an explicit, inspectable assumption
// — which is exactly why every region it produces is tier E. When real set/rep
// logging arrives, this map is what gets replaced; nothing downstream changes.
const WORKOUT_MAP = {
  arms: { bicep:1, tricep:1, delt:.7, forearm:.55, chest:.45, lat:.4 },
  core: { abs:1, oblique:.85, lowback:.6, glute:.3 },
  ride: { quad:.85, calf:.6, glute:.55, ham:.45, shin:.3 },
  walk: { calf:.5, quad:.35, ham:.3, glute:.3, shin:.25 }
};
// A region belongs to a stimulus group by its `pair`, or by its own id.
function bodyGroupOf(r){ return r.pair || r.id; }

// --- 3 · SYSTEM REGISTRY -------------------------------------------------
// state: 'live'   — fully sourced from what you already log
//        'partial'— sourced, but thin until more measurements exist
//        'locked' — cannot be honestly derived from behaviour at all
const BODY_SYSTEMS = [
  { id:'muscle', label:'Muscle & training', state:'live', view:'both', tier:'E',
    blurb:'Where your logged sessions actually landed, recency-weighted.',
    legend:['no logged work','thin','covered'] },
  { id:'cardio', label:'Cardiorespiratory', state:'partial', view:'anterior', tier:'E',
    shows:['heart','lung_l','lung_r'],
    blurb:'Aerobic volume against the WHO target, plus your resting-HR readings.',
    legend:['no signal','below target','at target'] },
  { id:'recovery', label:'Sleep & recovery', state:'partial', view:'anterior', tier:'E',
    shows:['brain'], wash:true,
    blurb:'Sleep duration and quality against AASM, carried across the window.',
    legend:['poor','mixed','good'] },
  { id:'organ', label:'Metabolic & organs', state:'locked', view:'anterior', tier:'M',
    shows:['brain','heart','lung_l','lung_r','liver','kidney_l','kidney_r','gut'],
    blurb:'Liver, kidneys, metabolic. Unlocks with a standard blood panel — ALT, AST, GGT, HbA1c, lipids. About $60 in Ontario, often covered.',
    lockNote:'HEBE will not guess at these. Behaviour cannot infer them, and no app can. It will track them properly once they are real numbers.' }
];
const BODY_SYSTEM = {}; BODY_SYSTEMS.forEach(s=>{ BODY_SYSTEM[s.id]=s; });

// --- 4 · SIGNAL LAYER ----------------------------------------------------
// Recency weighting. A 3.5-day half-life over a 21-day read means yesterday's
// session shows bright and three weeks ago is nearly gone. It is a DISPLAY
// CONVENTION chosen so the map answers "what have I been hitting lately" — not
// a claim about how fast tissue adapts. Stated in the UI, not hidden here.
const BODY_HALFLIFE = 3.5;
const BODY_WINDOW   = 21;
const BODY_TRACK    = 60;   // how far back the scrubber can travel

function bodyDecay(ageDays){ return Math.pow(0.5, ageDays / BODY_HALFLIFE); }
// Pure read: the logged days at or before `date`, newest first, with their age.
function bodyLoggedWindow(date, n){
  const end = new Date(date+'T12:00:00');
  const out = [];
  for(let i=0;i<n;i++){
    const dt = new Date(end); dt.setDate(dt.getDate()-i);
    const k = dstr(dt), d = S.days[k];
    if(d && d.updatedAt>0) out.push({ key:k, day:d, age:i });
  }
  return out;
}
function bodyClamp01(v){ return v<0?0:v>1?1:v; }

// muscle — decayed stimulus per group, normalised against a "well covered"
// reference of ~2 solid sessions inside one half-life.
function bodySignalMuscle(date){
  const win = bodyLoggedWindow(date, BODY_WINDOW);
  const acc = {}, src = {};
  win.forEach(({key,day,age})=>{
    const m = day.metrics, w = bodyDecay(age);
    const add = (map, units, label)=>{
      if(units<=0) return;
      Object.keys(map).forEach(g=>{
        acc[g] = (acc[g]||0) + map[g]*units*w;
        (src[g] = src[g]||[]).push({ key, label, units, w });
      });
    };
    if(m.workoutDone && (m.workoutMin||0)>0){
      const type = day.workoutType;
      if(type && WORKOUT_MAP[type]) add(WORKOUT_MAP[type], (m.workoutMin||0)/45, type+' session, '+(m.workoutMin||0)+' min');
    }
    if((m.rideH||0)>0) add(WORKOUT_MAP.ride, m.rideH/1.0, (m.rideH).toFixed(1)+'h ride');
  });
  const REF = 2.0;
  const out = {};
  BODY_REGIONS.forEach(r=>{
    if(r.organ) return;
    const g = bodyGroupOf(r);
    const raw = acc[g]||0;
    const list = (src[g]||[]).sort((a,b)=>a.key<b.key?1:-1).slice(0,4);
    out[r.id] = {
      v: bodyClamp01(raw/REF), tier:'E',
      note: raw<=0.001 ? 'No logged work reached this in '+BODY_WINDOW+' days.'
                       : 'Inferred from your session type, not from what you actually lifted.',
      parts: list.map(x=>shortDate(x.key)+' · '+x.label)
    };
  });
  return out;
}
// cardio — aerobic minutes against the WHO 150 min/wk target, and resting HR.
function bodySignalCardio(date){
  const win = bodyLoggedWindow(date, 7);
  let modMin = 0, rhrs = [];
  win.forEach(({day})=>{
    const m = day.metrics;
    modMin += (m.rideH||0)*60 + ((m.workoutDone && m.workoutMin)||0)*0.5;
    const r = (day.heart&&day.heart.rhr) || (day.wearable&&day.wearable.restingHR);
    if(r) rhrs.push(r);
  });
  const volV = bodyClamp01(modMin/150);
  const rhr  = rhrs.length ? rhrs.reduce((a,b)=>a+b,0)/rhrs.length : null;
  // 48 bpm -> 1, 82 bpm -> 0. Same direction as the age engine's RHR lever.
  const hrV  = rhr==null ? null : bodyClamp01((82-rhr)/34);
  const out = {};
  out.heart = { v: hrV==null ? 0 : hrV, tier: rhr==null?'E':'M',
    note: rhr==null ? 'No resting-HR reading in 7 days — log one on this screen and this becomes measured.'
                    : 'Mean resting HR '+Math.round(rhr)+' bpm across '+rhrs.length+' reading'+(rhrs.length>1?'s':'')+'.',
    parts: rhrs.length ? ['resting HR '+Math.round(rhr)+' bpm'] : [] };
  const lung = { v: volV, tier:'E',
    note: Math.round(modMin)+' min moderate-equivalent in 7 days (WHO target 150).',
    parts: ['aerobic volume '+Math.round(modMin)+'/150 min'] };
  out.lung_l = lung; out.lung_r = Object.assign({}, lung);
  return out;
}
// recovery — sleep hours and quality against AASM 7–9h, carried over the week.
function bodySignalRecovery(date){
  const win = bodyLoggedWindow(date, 7);
  if(!win.length) return { brain:{ v:0, tier:'E', note:'Nothing logged in the last 7 days.', parts:[] } };
  let sl=0, q=0, st=0;
  win.forEach(({day})=>{ const m=day.metrics; sl+=m.sleepH; q+=m.sleepQ; st+=m.stress; });
  const n = win.length, sleepH = sl/n, sleepQ = q/n, stress = st/n;
  // distance from the 7–9h band, plus self-rated quality, minus stress load
  const dur = bodyClamp01(1 - Math.max(0, sleepH<7 ? (7-sleepH)/3 : (sleepH-9)/3));
  const v = bodyClamp01(dur*0.55 + (sleepQ/10)*0.30 + (1-stress/10)*0.15);
  const note = sleepH.toFixed(1)+'h average, quality '+sleepQ.toFixed(1)+'/10, stress '+stress.toFixed(1)+'/10 across '+n+' logged day'+(n>1?'s':'')+'.';
  return { brain:{ v, tier:'E', note, parts:['sleep '+sleepH.toFixed(1)+'h','quality '+sleepQ.toFixed(1)+'/10','stress '+stress.toFixed(1)+'/10'] } };
}
// Dispatch. Every system resolves through here, so a new one is one function.
function bodyState(systemId, date){
  const sys = BODY_SYSTEM[systemId] || BODY_SYSTEMS[0];
  if(sys.state==='locked') return { sys, regions:{}, locked:true };
  const regions = systemId==='cardio' ? bodySignalCardio(date)
                : systemId==='recovery' ? bodySignalRecovery(date)
                : bodySignalMuscle(date);
  return { sys, regions, locked:false };
}

// --- 5 · PAINT -----------------------------------------------------------
// value -> colour token. Four steps, not a continuous ramp: a gradient invites
// reading precision that a session-type inference does not have.
function bodyPaint(v){
  if(v==null || v<0.02) return { fill:'var(--line2)', op:.30, band:'none' };
  if(v<0.30)            return { fill:'var(--amber)',  op:.32, band:'thin' };
  if(v<0.65)            return { fill:'var(--teal)',   op:.45, band:'covered' };
  return                       { fill:'var(--teal)',   op:.88, band:'strong' };
}

// --- 6 · RENDER + INTERACTION -------------------------------------------
let bodySys = 'muscle', bodyView = 'anterior', bodyOffset = 0, bodyPlayTimer = null, bodyPick = null;

function bodyMapDate(){
  const d = new Date(S.date+'T12:00:00'); d.setDate(d.getDate()-bodyOffset); return dstr(d);
}
function bodySvg(){
  const sys = BODY_SYSTEM[bodySys];
  const view = sys.view==='both' ? bodyView : sys.view;
  let h = '<svg id="bmSvg" viewBox="0 0 200 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Body map">';
  h += '<g class="bm-sil">'+BODY_SILHOUETTE.map(d=>'<path d="'+d+'"/>').join('')+'</g>';
  h += '<g class="bm-regions">';
  BODY_REGIONS.forEach(r=>{
    if(sys.shows){ if(sys.shows.indexOf(r.id)<0) return; }
    else if(r.organ || r.view !== view) return;
    h += '<path class="bm-r" id="bm_'+r.id+'" data-bregion="'+r.id+'" d="'+r.d+'"><title>'+esc(r.label)+'</title></path>';
  });
  h += '</g></svg>';
  return h;
}
function bodyMapHTML(){
  const sys = BODY_SYSTEM[bodySys];
  let h = '<div class="card mt fade bodymap" id="bodyMapCard">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'

  h += '<div class="bm-sys">'+BODY_SYSTEMS.map(s=>
        '<span class="chip bm-syschip '+(s.id===bodySys?'on':'')+(s.state==='locked'?' locked':'')+'" data-bsys="'+s.id+'">'
        + (s.state==='locked'?'&#128274; ':'')+esc(s.label)+'</span>').join('')+'</div>';

  h += '<div class="bm-wrap">';
  h += '<div class="bm-figure">'+bodySvg();
  if(sys.view==='both'){
    h += '<div class="bm-view">'
      + '<span class="chip '+(bodyView==='anterior'?'on':'')+'" data-bview="anterior">Front</span>'
      + '<span class="chip '+(bodyView==='posterior'?'on':'')+'" data-bview="posterior">Back</span></div>';
  }
  h += '</div>';
  h += '<div class="bm-side">';
  h += '<div class="bm-blurb">'+esc(sys.blurb)+'</div>';
  if(sys.state==='locked'){
    h += '<div class="bm-lock"><div class="t">&#128274; Locked</div><div class="b">'+esc(sys.lockNote)+'</div></div>';
  } else {
    h += '<div class="bm-legend">'
      + '<span><i style="background:var(--line2);opacity:.5"></i>'+esc(sys.legend[0])+'</span>'
      + '<span><i style="background:var(--amber);opacity:.5"></i>'+esc(sys.legend[1])+'</span>'
      + '<span><i style="background:var(--teal)"></i>'+esc(sys.legend[2])+'</span></div>';
    h += '<div id="bmInspect" class="bm-inspect"></div>';
    h += '<div id="bmGaps" class="bm-gaps"></div>';
  }
  h += '</div></div>';

  // time scrub — the same bodyState() at a different date, so replay is free
  if(sys.state!=='locked'){
    h += '<div class="bm-time">'
      + '<button class="btn" id="bmPlay" style="font-size:12px;padding:6px 12px">&#9654; Replay</button>'
      + '<input type="range" id="bmScrub" min="0" max="'+BODY_TRACK+'" step="1" value="'+(BODY_TRACK-bodyOffset)+'">'
      + '<span class="bm-date" id="bmDate"></span></div>';
    h += '<div class="sub bm-foot">Recency-weighted over '+BODY_WINDOW+' days, half-life '+BODY_HALFLIFE+' days — a display convention so recent work reads brighter, not a claim about how fast tissue adapts. Muscle and fat move over weeks; nothing here changes because of one day.</div>';
  }
  h += '</div>';
  return h;
}
// Repaint only — no re-render, so scrubbing and replay stay instant.
function bodyRepaint(){
  const card = document.getElementById('bodyMapCard'); if(!card) return;
  const date = bodyMapDate();
  const st = bodyState(bodySys, date);
  const dEl = document.getElementById('bmDate');
  if(dEl) dEl.textContent = (bodyOffset===0?'today':shortDate(date)) + (bodyOffset?' · '+bodyOffset+'d ago':'');
  card.querySelectorAll('.bm-r').forEach(p=>{
    const id = p.dataset.bregion, s = st.regions[id];
    const pt = st.locked ? { fill:'var(--line2)', op:.22 } : bodyPaint(s?s.v:0);
    p.style.fill = pt.fill; p.style.fillOpacity = pt.op;
    p.classList.toggle('sel', bodyPick===id);
  });
  // Sleep is systemic, not a body part — so that layer tints the whole figure
  // rather than pretending recovery lives in one organ.
  const washKey = st.sys.wash ? Object.keys(st.regions)[0] : null;
  const wash = washKey ? bodyPaint(st.regions[washKey].v) : null;
  card.querySelectorAll('.bm-sil path').forEach(p=>{
    p.style.fill = wash ? wash.fill : '';
    p.style.fillOpacity = wash ? Math.max(.12, wash.op*0.5) : '';
  });
  const ins = document.getElementById('bmInspect');
  if(ins){
    const s = bodyPick && st.regions[bodyPick];
    if(s){
      const r = BODY_REGION[bodyPick];
      ins.innerHTML = '<div class="t">'+esc(r.label)+' <span class="tier">'+s.tier+'</span></div>'
        + '<div class="bar"><i style="width:'+Math.round(s.v*100)+'%"></i></div>'
        + '<div class="b">'+esc(s.note)+'</div>'
        + (s.parts.length? '<div class="p">'+s.parts.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>':'');
    } else {
      ins.innerHTML = '<div class="b dim">Tap a region to see what fed it.</div>';
    }
  }
  const gaps = document.getElementById('bmGaps');
  if(gaps && !st.locked){
    // The point of the map: name what the log never reaches.
    const cold = Object.keys(st.regions)
      .filter(id=>st.regions[id].v<0.02 && BODY_REGION[id] && !BODY_REGION[id].organ)
      .map(id=>BODY_REGION[id].label);
    const uniq = cold.filter((x,i)=>cold.indexOf(x)===i);
    gaps.innerHTML = uniq.length
      ? '<div class="t">Nothing logged reached</div><div class="b">'+esc(uniq.join(' · '))+'</div>'
      : '';
  }
}
function bodyMapMount(){
  const card = document.getElementById('bodyMapCard'); if(!card) return;
  card.querySelectorAll('.bm-r').forEach(p=>{
    p.addEventListener('mouseenter', ()=>{ bodyPick = p.dataset.bregion; bodyRepaint(); });
  });
  bodyRepaint();
}
function bodyPlayToggle(){
  const btn = document.getElementById('bmPlay');
  if(bodyPlayTimer){ clearInterval(bodyPlayTimer); bodyPlayTimer=null; if(btn) btn.innerHTML='&#9654; Replay'; return; }
  bodyOffset = BODY_TRACK;
  if(btn) btn.innerHTML='&#9632; Stop';
  bodyPlayTimer = setInterval(()=>{
    bodyOffset -= 1;
    if(bodyOffset<=0){ bodyOffset=0; clearInterval(bodyPlayTimer); bodyPlayTimer=null; if(btn) btn.innerHTML='&#9654; Replay'; }
    const sc = document.getElementById('bmScrub'); if(sc) sc.value = BODY_TRACK-bodyOffset;
    bodyRepaint();
  }, 90);
}

async function scoreSkinPhoto(file){
  if(!S.settings.apiKey){ toast('Add an API key in Setup for AI skin reads'); return; }
  toast('Reading skin photo…');
  const b64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
  const mediaType = file.type||'image/jpeg';
  try{
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{ 'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:S.settings.model||'claude-sonnet-5', max_tokens:400,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mediaType,data:b64}},
          {type:'text',text:'Assess this face photo for skin condition trends an athlete would track: overall score 1-10 (10 = clear, even, hydrated), plus one line on inflammation/texture/tone. Not medical advice, just a consistency tracker. ONLY JSON: {"score":<1-10>,"notes":"<one line>"}'}]}] })
    });
    if(!r.ok) throw new Error('API '+r.status);
    const j = await r.json();
    const p = extractJSON(textFromContent(j));
    const d = ensureDay(S.date);
    d.skin.score = clamp(Math.round(p.score),1,10); d.skin.notes = p.notes||'';
    touchDay(S.date); render(); toast('Skin read: '+d.skin.score+'/10');
  }catch(e){ console.warn(e); toast('Skin read failed — you can self-score instead'); }
}

function reportCharts(){
  if(typeof Chart==='undefined') return;
  const dates = rangeDates(S.trendRange);
  const lbl = dates.map(x=>x.slice(5));
  const age = dates.map(dt=>{ const d=S.days[dt]; return d&&d.updatedAt>0&&d.hebeAge!=null? d.hebeAge:null; });
  const chrono0 = chronoAge(dates[0]);
  const sleep7 = rolling(dates.map(dt=>{ const d=S.days[dt]; return d&&d.updatedAt>0? d.metrics.sleepH:null; }),7);
  const load = dates.map(dt=>{ const d=S.days[dt]; return d&&d.updatedAt>0? d.metrics.rideH+(d.metrics.workoutMin||0)/60:null; });
  const c = document.getElementById('chReport'); if(!c) return;
  const o = baseOpts(undefined,undefined);
  o.scales.y1={position:'right',min:0,max:14,grid:{display:false},ticks:{color:css('--text3'),font:{size:10.5}}};
  const ds = [
    { type:'line', label:'HEBE age', data:age, borderColor:css('--teal'), tension:.3, spanGaps:true, pointRadius:2, borderWidth:2.5, yAxisID:'y' },
    { type:'line', label:'chrono', data:dates.map((dt,i)=>chrono0+i/365.2425), borderColor:css('--line2'), borderDash:[4,4], pointRadius:0, borderWidth:1, yAxisID:'y' } ];
  if(document.getElementById('ovSleep')&&document.getElementById('ovSleep').checked)
    ds.push({ type:'line', label:'sleep 7d', data:sleep7, borderColor:css('--purple'), tension:.3, spanGaps:true, pointRadius:0, borderWidth:1.5, yAxisID:'y1' });
  if(document.getElementById('ovLoad')&&document.getElementById('ovLoad').checked)
    ds.push({ type:'bar', label:'load', data:load, backgroundColor:css('--amber-bg'), borderRadius:3, yAxisID:'y1' });
  o.plugins.legend={display:true,labels:{color:css('--text2'),font:{size:11},boxWidth:14}};
  charts.report = new Chart(c,{ data:{labels:lbl,datasets:ds}, options:o, plugins:[crosshair, protocolBandPlugin(dates)] });
  attachStory(charts.report, dates);
}

      const txt = await claude([{role:'user',content:'Weekly data: '+JSON.stringify(summary)+'. Write a professional weekly performance report (5-8 short lines, plain text, no markdown): status, load vs recovery, nutrition quality, protocol observation if any, and exactly ONE change for next week. Athlete-level, direct, honest.'}], 'You are HEBE, a longevity performance coach writing a weekly report for one athlete. No fluff.', 500);
      out.textContent = txt.trim();
      localStorage.setItem('hebe_lastreport', txt.trim());

  }
}

function doExport(){

function doImport(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{ try{
    const j = JSON.parse(rd.result);
    if(!j.days) throw new Error('not a HEBE backup');
    let n=0;
    Object.entries(j.days).forEach(([k,v])=>{ const l=S.days[k]; if(!l||(v.updatedAt||0)>=(l.updatedAt||0)){S.days[k]=v;n++;} });
    if(j.templates) S.templates=j.templates;
    if(j.protocols) S.protocols=j.protocols;

}

const OB_DEFAULT = Object.assign({}, GUEST_TEMPLATE.weekday);
const OB_PRESETS = {
  desk:     { key:'desk',     wd:{ sleepH:7,   sitH:9, workoutDone:false, workoutMin:0,  rideH:0,   sunMin:10, protein:80,  stress:5, fastingH:12 } },

function obAge(dob){ const d = new Date((dob||'')+'T12:00:00'); return isNaN(d) ? null : (Date.now()-d)/(365.2425*864e5); }
// "6", "6:30", "6am", "11pm", "23:00". pm=true biases a bare 1–11 to the evening (bed times).
function obParseTime(str, pm){
  let m = String(str||'').match(/^\s*(\d{1,2})(\d{2})\s*(am|pm|a\.m\.|p\.m\.)?\s*$/i);          // "630", "1130pm"
  if(!m) m = String(str||'').match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?/i);
  if(!m) return null;
  let h=+m[1], mi=m[2]?+m[2]:0; const ap=(m[3]||'').replace(/\./g,'').toLowerCase();
  if(h>24||mi>59) return null;
  if(ap==='pm'&&h<12) h+=12; else if(ap==='am'&&h===12) h=0;
  else if(!ap && pm && h>=1 && h<=11) h+=12;
  return h+mi/60;
}
// Duration in hours from "45 min", "1.5h", "an hour", "half an hour"; null if none.
function obDur(s){
  s = String(s||'').toLowerCase();
  if(/half\s+an?\s+hour/.test(s)) return 0.5;
  if(/\ban?\s+hour\b/.test(s)) return 1;
  let m = s.match(/(\d+(?:\.\d+)?)\s*(?:h\b|hr\b|hrs\b|hour|hours)/); if(m) return +m[1];
  m = s.match(/(\d+)\s*(?:m\b|min\b|mins\b|minutes?)/); if(m) return +m[1]/60;
  return null;
}
// Deterministic parser: free text → the existing template fields. Every field
// it sets is recorded in `heard` with the reason; everything else stays an
// assumption and is shown as one. No model, nothing hidden.
function parseDayText(txt, base){
  const f = Object.assign({}, OB_DEFAULT, base||{}); const heard = {}; const notes = {};
  const raw = String(txt||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
  if(!raw) return { fields:f, heard:[], heardWhy:{}, notes, empty:true, low:true };
  const T = '(\\d{3,4}\\s*(?:am|pm)?\\b|\\d{1,2}(?:[:.]\\d{2})?\\s*(?:am|pm|a\\.m\\.|p\\.m\\.)?)';
  const clauses = raw.split(/[,.;!?\n]|\band\b|\bthen\b|\bafter that\b/).map(c=>c.trim()).filter(Boolean);
  let wake=null, bed=null, first=null, last=null;
  const NEG = /\b(no|not|never|don't|dont|skip|skipped|without)\b/;
  clauses.forEach(c=>{
    let m; const dur = obDur(c);
    if((m=c.match(new RegExp('(?:\\bup\\b|wake|woke|awake|rise|alarm)\\D{0,10}?'+T)))) wake = obParseTime(m[1], false);
    // a bed time, but not "sleep about 6h" (a duration, handled below)
    if((m=c.match(new RegExp('(?:\\bbed\\b|asleep|lights out|sleep)\\s*(?:by|at|around|about|~)?\\s*'+T))) && !(dur!=null && /sleep/.test(c) && !/\bbed\b|asleep|lights out/.test(c))) bed = obParseTime(m[1], true);
    if(/\b(sleep|slept|sleeping)\b/.test(c) && dur!=null && dur>=3 && dur<=12 && !/\bbed\b|asleep/.test(c)){ f.sleepH = dur; heard.sleepH = 'said'; }
    if(/\b(ride|rides|riding|bike|biking|cycle|cycling|run|running|jog|jogging|swim|swimming|row|rowing|cardio|commute|walk|walking|hike|hiking)\b/.test(c) && !NEG.test(c)){
      const h = dur!=null ? dur : 0.5;
      f.rideH = Math.round(((heard.rideH ? f.rideH : 0) + h)*100)/100;
      heard.rideH = dur!=null ? 'said' : 'assumed30';
    }
    if(/\b(gym|workout|work out|lift|lifting|weights|strength|crossfit|yoga|pilates|spin class|class|training|train)\b/.test(c) && !NEG.test(c) && !/rest day/.test(c)){
      f.workoutDone = true; f.workoutMin = dur!=null ? Math.round(dur*60) : 45; heard.workoutMin = dur!=null ? 'said' : 'assumed45';
    }
    if(/rest day|no gym|don't train|dont train|no workout|no exercise|don't exercise|never exercise|not (?:very )?active|no time (?:for|to) (?:exercise|gym|train|work ?out)|sedentary/.test(c)){ f.workoutDone=false; f.workoutMin=0; f.rideH=0; heard.workoutMin='said'; }
    if(/\b(desk|sit|sitting|sat|office|computer|screen|meetings|driving|drive|laptop|wfh|work from home|studying|study|lectures)\b/.test(c)){
      // a duration only counts for sitting when it is hours-scale and not already an activity's ("ride 40 min ... sit all day")
      const sitDur = (dur!=null && dur>=2 && !/\b(ride|bike|cycle|run|jog|walk|swim|gym|workout|train|lift|class)\w*/.test(c)) ? dur : null;
      f.sitH = sitDur!=null ? Math.min(14, sitDur) : (/all day|whole day|9\s*(?:to|-|–)\s*5|full day|most of the day/.test(c) ? 9 : 8);
      heard.sitH = sitDur!=null ? 'said' : 'assumed8';
    }
    if(/on my feet|standing|nurse|nursing|construction|warehouse|retail|teacher|teaching|barista|server|waiter|waitress|chef|kitchen|site work|labou?rer/.test(c)){ f.sitH = 3; heard.sitH = 'said'; }
    if((m=c.match(new RegExp('(?:breakfast|first meal|first eat|eat at|eating at)\\D{0,10}?'+T)))) first = obParseTime(m[1], false);
    if((m=c.match(new RegExp('(?:dinner|supper|last meal|big meal|main meal|evening meal)\\D{0,10}?'+T)))) last = obParseTime(m[1], true);
    if(/skip breakfast|no breakfast|don't eat (?:until|till)|intermittent|16[:/ ]?8|fasting/.test(c)){ f.fastingH = 16; heard.fastingH = 'said'; }
    if(/one meal a day|omad/.test(c)){ f.fastingH = 22; heard.fastingH = 'said'; }
    if(/stress|hectic|deadline|burn(?:ed|t)? ?out|anxious|overwhelm|exhaust/.test(c) && !/no stress|not stress|low stress/.test(c)){ f.stress = 7; f.mood = 5; heard.stress = 'said'; }
    if(/\b(chill|relaxed|calm|easy day|quiet day|low stress)\b/.test(c)){ f.stress = 2; heard.stress = 'said'; }
    if(/\b(outside|outdoors|sun\b|sunlight|garden|gardening|the dog)\b/.test(c)){ f.sunMin = dur!=null ? Math.round(dur*60) : 30; heard.sunMin = dur!=null ? 'said' : 'assumed30'; }
    if(/vitamin|supplement|creatine|omega|magnesium|fish oil/.test(c)){ f.supplements = true; heard.supplements = 'said'; }
    if((m=c.match(/(\d+(?:\.\d+)?)\s*(?:l\b|litres?|liters?)/)) && /water|drink/.test(c)){ f.water = +m[1]; heard.water = 'said'; }
    if((m=c.match(/(\d+)\s*g\b/)) && /protein/.test(c)){ f.protein = +m[1]; heard.protein = 'said'; }
  });
  if(wake!=null) notes.wake = wake; if(bed!=null) notes.bed = bed;
  if(!heard.sleepH && wake!=null && bed!=null){ const s = (wake-bed+24)%24; if(s>=3 && s<=12){ f.sleepH = Math.round(s*4)/4; heard.sleepH = 'times'; } }

  const trainH = (+f.rideH||0) + (+f.workoutMin||0)/60;
  f.act = trainH>=1.5 ? 'very' : trainH>=0.75 ? 'active' : trainH>0 ? 'light' : 'sed';
  const keys = Object.keys(heard);
  return { fields:f, heard:keys, heardWhy:heard, notes, empty:false, low: keys.length<=2 };
}
// Weekend: starts from the weekday with a weekend prior (less sitting, no commute,
// no session unless said). "same" copies the weekday outright.
function parseWeekendText(txt, wd){
  wd = wd || OB_DEFAULT;
  const raw = String(txt||'').toLowerCase();
  const same = /\b(same|similar|no different|like a weekday|identical)\b/.test(raw);
  const prior = same ? Object.assign({}, wd) : Object.assign({}, wd, { sitH: Math.max(2, Math.min(5, wd.sitH-3)), rideH:0, workoutDone:false, workoutMin:0, sunMin: Math.max(wd.sunMin||0, 25), stress: Math.min(wd.stress||4, 3) });
  const r = parseDayText(raw, prior);
  if(/sleep in|lie in|sleep late|sleep longer|sleep more/.test(raw) && !r.heardWhy.sleepH){ r.fields.sleepH = Math.min(9.5, (wd.sleepH||7.5)+1); r.heard.push('sleepH'); r.heardWhy.sleepH = 'said'; }
  if(/no work|day off|days off|off work|not working|weekend off|don't work/.test(raw) && !r.heardWhy.sitH){ r.fields.sitH = 3; r.heard.push('sitH'); r.heardWhy.sitH = 'said'; }
  if(/\b(work|shift|shifts)\b/.test(raw) && !/no work|off work|don't work|not working/.test(raw) && !r.heardWhy.sitH){ r.fields.sitH = wd.sitH; r.heard.push('sitH'); r.heardWhy.sitH = 'said'; }
  r.same = same;
  r.low = r.empty || (r.heard.length<=1 && !same);
  return r;
}

function obDotsHTML(){ return '<div class="ob-dots">'+[0,1,2,3,4].map(i=>'<span class="'+(i<=ob.step?'on':'')+'"></span>').join('')+'</div>'; }
function obNavHTML(nextId, nextLabel){
  const nextBtn = nextId==='obDone' ? '<button class="btn primary" id="obDone">' : '<button class="btn primary" id="obNext">';
  return '<div class="ob-nav">'+(ob.step>0?'<button class="btn" id="obBack">'+t('ob_back')+'</button>':'<span></span>')+nextBtn+(nextLabel||t('ob_next'))+'</button></div>';
}
function obStepHTML(){
  const s = ob.step;
  if(s===0){
    return '<div>'+obDotsHTML()+'<h2 style="margin-top:0;font-size:18px;line-height:1.3">'+t('ob_hook')+'</h2>'
      + '<p class="sub" style="line-height:1.55;font-size:13px">'+t('ob_intro')+'</p>'
      + '<div style="font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin-top:14px">'+t('ob_before')+'</div>'
      + [1,2,3,4].map(i=>'<div class="ob-truth"><span style="color:var(--teal-dk);font-weight:800">'+i+'</span><span><b>'+t('ob_t'+i+'h')+'</b>'+t('ob_t'+i)+'</span></div>').join('')
      + '<button class="btn primary mt" id="obStart" style="width:100%;font-size:14px">'+t('ob_start')+'</button>'
      + '<div class="sub" style="font-size:11px;margin-top:8px;text-align:center">'+t('ob_noAccount')+'</div>'
      + '<button id="obSkip" class="mt" style="width:100%;background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline">'+t('ob_skip')+'</button></div>';
  }
  if(s===1){
    return '<div>'+obDotsHTML()+'<h2 style="margin-top:0">'+t('ob_s1h')+'</h2><div class="sub">'+t('ob_s1sub')+'</div>'
      + '<div class="frow mt"><div><label class="f">'+t('ob_name')+'</label><input id="obName" placeholder="Alex" value="'+esc(ob.name)+'" autocomplete="given-name"></div>'
      + '<div><label class="f">'+t('ob_dob')+'</label><input type="date" id="obDob" value="'+esc(ob.dob)+'"></div></div>'
      + '<div class="mt"><label class="f">'+t('ob_sex')+'</label><select id="obSex"><option value="na"'+(ob.sex==='na'?' selected':'')+'>'+t('ob_sexNa')+'</option><option value="female"'+(ob.sex==='female'?' selected':'')+'>'+t('ob_sexF')+'</option><option value="male"'+(ob.sex==='male'?' selected':'')+'>'+t('ob_sexM')+'</option></select>'
      + '<div class="sub" style="font-size:11px;margin-top:4px">'+t('ob_sexWhy')+'</div></div>'
      + obNavHTML() + '</div>';
  }
  if(s===2){
    const z = ob.rhrShown && ob.rhr ? zonesFromInputs(ob.dob, ob.rhr) : null;
    return '<div>'+obDotsHTML()+'<h2 style="margin-top:0">'+t('ob_s2h')+'</h2>'
      + '<div class="sub" style="line-height:1.55">'+t('ob_s2how')+'</div>'
      + '<div class="frow mt"><div><label class="f">'+t('ob_s2label')+'</label><input type="number" id="obRhr" min="30" max="120" placeholder="'+t('ob_s2ph')+'" value="'+(ob.rhr||'')+'"></div>'
      + '<button class="btn primary" id="obRhrGo">'+t('ob_s2go')+'</button></div>'
      + (ob.rhrShown && !z ? '<div class="sub mt" style="color:var(--amber)">'+t('ob_s2bad')+'</div>' : '')
      + obZonesHTML(z)
      + '<div class="card" style="margin-top:12px;padding:12px 14px;background:var(--card2)"><b style="font-size:13px">'+t('ob_promiseH')+'</b><div class="sub" style="margin-top:3px;line-height:1.5">'+t('ob_promise')+'</div></div>'
      + obNavHTML('obNext', z ? t('ob_next') : t('ob_s2skip')) + '</div>';
  }
  if(s===3){
    const chips = (day)=>'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+Object.keys(OB_PRESETS).map(k=>'<span class="chip" data-obpreset="'+k+'" data-obday="'+day+'">'+t('ob_p_'+k)+'</span>').join('')+'</div>';
    let h = '<div>'+obDotsHTML()+'<h2 style="margin-top:0">'+t('ob_s3h')+'</h2><div class="sub" style="line-height:1.5">'+t('ob_s3sub')+'</div>'
      + '<textarea class="ob mt" id="obDayText" placeholder="'+esc(t('ob_s3ph'))+'">'+esc(ob.wdText)+'</textarea>'
      + '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="btn primary" id="obParse">'+t('ob_read')+'</button><span class="sub2">'+t('ob_or')+'</span></div>'
      + chips('wd');
    if(ob.wdParse){
      h += obShowbackHTML('wd', ob.wdParse);
      h += '<div class="mt" style="border-top:1px solid var(--line);padding-top:12px"><b style="font-size:13.5px">'+t('ob_weH')+'</b><div class="sub">'+t('ob_weSub')+'</div>'
        + '<textarea class="ob" style="margin-top:8px;min-height:54px" id="obWeText" placeholder="'+esc(t('ob_wePh'))+'">'+esc(ob.weText)+'</textarea>'
        + '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="btn" id="obParseWe">'+t('ob_weRead')+'</button><span class="sub2">'+t('ob_or')+'</span></div>' + chips('we');
      if(ob.weParse) h += obShowbackHTML('we', ob.weParse);
      else h += '<div class="sub" style="font-size:11px;margin-top:8px">'+t('ob_weAssumed')+'</div>';
      h += '</div>';
    }
    h += obNavHTML('obNext', ob.wdParse ? t('ob_next') : t('ob_s3skip')) + '</div>';
    return h;
  }
  // s===4 — what HEBE knows + the locked layers
  const wd = ob.wd || OB_DEFAULT, we = ob.we || parseWeekendText('', wd).fields;
  const z = ob.rhr ? zonesFromInputs(ob.dob, ob.rhr) : null;
  const age = obAge(ob.dob);
  const row = (k, v, go)=>'<div class="ob-row" style="padding:5px 0"><span class="sub" style="flex-shrink:0">'+k+'</span><span style="text-align:right;font-size:12.5px">'+v+(go!=null?' <a href="#" data-obgo="'+go+'" class="sub2" style="text-decoration:underline">'+t('ob_edit')+'</a>':'')+'</span></div>';
  let h = '<div>'+obDotsHTML()+'<h2 style="margin-top:0">'+t('ob_s4h')+'</h2><div class="sub" style="line-height:1.5">'+t('ob_s4sub')+'</div>';
  h += '<div class="ob-group"><div class="k">'+t('ob_stated')+'</div>'
    + row(t('ob_kYou'), esc(ob.name)+' · '+(age?Math.floor(age):'?')+' · '+t('ob_sex'+(ob.sex==='male'?'M':ob.sex==='female'?'F':'Na')).toLowerCase(), 1)
    + row(t('ob_kWeekday'), obDaySummary(wd), 3)
    + row(t('ob_kWeekend'), obDaySummary(we), 3)
    + row(t('ob_kRhr'), ob.rhr ? ob.rhr+' bpm · '+t('ob_oneReading') : t('ob_notYet'), 2)
    + '</div>';
  h += '<div class="ob-group"><div class="k">'+t('ob_derived')+'</div>'
    + row(t('ob_kZones'), z ? '<b>'+z.bands[2].name+'</b> '+z.bands[2].loBpm+'–'+z.bands[2].hiBpm+' bpm ±'+z.bands[2].err+' · '+tierBadge('E') : t('ob_zonesAfterRhr'))
    + row(t('ob_kProtein'), '~'+Math.round(wd.protein)+' g/day · '+tierBadge('E', t('ob_tagAssumedShort')))
    + row(t('ob_kAge'), t('ob_baselineForming'))
    + '</div>';
  h += '<div class="ob-group"><div class="k">'+t('ob_unknown')+'</div><div class="sub" style="line-height:1.5">'+t('ob_unknownList')+'<br><span class="sub2">'+t('ob_unknownNote')+'</span></div></div>';
  h += '<div class="ob-group"><div class="k">'+t('ob_lockH')+'</div>'
    + '<div class="ob-lock"><span>✅</span><span><b>'+t('ob_lockHabits')+'</b> — '+t('ob_lockHabitsD')+'</span></div>'
    + '<div class="ob-lock"><span>🔒</span><span><b>'+t('ob_lockCardio')+'</b> — '+t('ob_lockCardioD')+'</span></div>'
    + '<div class="ob-lock"><span>🔒</span><span><b>'+t('ob_lockBody')+'</b> — '+t('ob_lockBodyD')+'</span></div>'
    + '<div class="ob-lock"><span>🔒</span><span><b>'+t('ob_lockBlood')+'</b> — '+t('ob_lockBloodD')+'</span></div>'
    + '<div class="sub" style="margin-top:4px;font-style:italic">'+t('ob_lockNote')+'</div></div>';
  h += '<label class="mt" style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);cursor:pointer"><input type="checkbox" id="obSample"'+(ob.sample?' checked':'')+' style="width:auto"> '+t('ob_sample')+'</label>';
  h += obNavHTML('obDone', t('ob_done')) + '</div>';
  return h;
}
function obRender(){
  showModal(obStepHTML());
  document.getElementById('modalBox').scrollTop = 0;
  if(ob.step===1) setTimeout(()=>{ const el=document.getElementById('obName'); if(el && !el.value) el.focus(); }, 30);
}
// Read the current screen's inputs into state before moving; returns false to stay.
function obReadForm(){
  const s = ob.step, g = id => document.getElementById(id);
  if(s===1){
    ob.name = (g('obName').value||'').trim(); ob.dob = g('obDob').value; ob.sex = g('obSex').value;
    return true;
  }
  if(s===2){ const v = +(g('obRhr')||{}).value; ob.rhr = v>0 ? v : null; return true; }
  if(s===3){
    ob.wdText = (g('obDayText')||{}).value||''; ob.weText = (g('obWeText')||{}).value||ob.weText;
    if(ob.wdParse) ob.wd = obReadShowback('wd');
    if(ob.weParse) ob.we = obReadShowback('we');
    return true;
  }
  if(s===4){ ob.sample = !!(g('obSample')||{}).checked; return true; }
  return true;
}
function obValidate(){
  if(ob.step===1){
    if(!ob.name){ toast(t('ob_needName')); return false; }
    const a = obAge(ob.dob);
    if(!ob.dob || a==null){ toast(t('ob_needDob')); return false; }
    if(a<13 || a>110){ toast(t('ob_badDob')); return false; }
  }
  if(ob.step===2 && ob.rhr!=null && (ob.rhr<30 || ob.rhr>120)){ toast(t('ob_s2bad')); return false; }
  return true;
}
function obGo(step){ obReadForm(); ob.step = Math.max(0, Math.min(4, step)); obRender(); }
function obNext(){ obReadForm(); if(!obValidate()) return; if(ob.step===3 && !ob.wd){ ob.wd = null; } ob.step++; obRender(); }
function obApplyPreset(key, day){
  obReadForm();
  if(day==='we'){ ob.weParse = obPresetParse(key, 'we'); ob.we = ob.weParse.fields; }
  else { ob.wdParse = obPresetParse(key, 'wd'); ob.wd = ob.wdParse.fields; ob.trainDays = null; }
  obRender();
}
function activityLabel(a){ return {sed:'mostly sedentary', light:'lightly active', active:'active', very:'very active'}[a]||'active'; }
function buildGuestTemplates(p){
  const t = JSON.parse(JSON.stringify(GUEST_TEMPLATE));
  const trains = Math.max(0, Math.min(7, p.trainDays||0));
  t.weekday.sleepH = p.sleep; t.weekend.sleepH = Math.min(9.5, p.sleep+0.5);
  t.weekday.sitH = p.sit; t.weekend.sitH = Math.max(2, p.sit-3);
  t.weekday.protein = p.protein; t.weekend.protein = p.protein;
  t.weekday.workoutDone = trains>=4; t.weekend.workoutDone = trains>=6;
  t.weekday.workoutMin = trains>0?40:0; t.weekend.workoutMin = trains>=6?40:0;
  return t;
}
function guestCoachBio(p){
  const age = Math.floor((Date.now()-new Date(p.dob+'T12:00:00'))/(365.2425*864e5));
  return p.name+', '+age+(p.sex&&p.sex!=='na'?' ('+p.sex+')':'')+', '+activityLabel(p.activity)+' (~'+(p.trainDays||0)+' training days/week), typical sleep ~'+p.sleep+'h, ~'+p.sit+'h sitting/day, protein target ~'+p.protein+'g';
}
function showOnboarding(){
  onboardingOpen = true;
  if(!ob) obReset();
  obRender();
}
function completeOnboarding(){
  if(!ob) obReset();
  obReadForm();
  if(!ob.name || !obAge(ob.dob)){ ob.step = 1; obRender(); toast(t('ob_needName')); return; }
  const wd = ob.wd || obPresetParse('moderate','wd').fields;
  const we = ob.we || parseWeekendText('', wd).fields;
  const trainDays = ob.trainDays!=null ? ob.trainDays : (wd.workoutDone ? 4 : 0);
  S.settings.name = ob.name; S.settings.dob = ob.dob; S.settings.sex = ob.sex;   // sex drives the nutrient targets; unknown takes the higher DRI
  S.settings.proteinTarget = Math.round(wd.protein||90);
  S.settings.coachBio = guestCoachBio({ name:ob.name, dob:ob.dob, sex:ob.sex, activity:wd.act||'active', trainDays, sleep:wd.sleepH, sit:wd.sitH, protein:Math.round(wd.protein||90) });
  S.templates = obTemplatesFromState(wd, we, trainDays);
  S.protocols = []; S.onboarded = true;
  if(S.days[S.date] && !S.days[S.date].confirmed) delete S.days[S.date];
  const d = ensureDay(S.date);
  // The first resting-HR reading lands on today's day through the side-feature
  // path: it counts as reading 1 of 3, and day one is NOT marked as logged.
  if(ob.rhr){ d.heart.rhr = ob.rhr; d.wearable.restingHR = ob.rhr; d.touchedAt = Date.now(); }
  persist(); localStorage.setItem('hebe_onboarded','1');
  onboardingOpen = false; hideModal();
  const wantSample = ob.sample, name = ob.name;
  ob = null;
  S.page = 'home';
  if(wantSample) loadSampleWeek(); else render();
  toast(t('ob_welcome', name));
}
function loadSampleWeek(){
  const n=16; const jit=(base,spread)=>Math.round((base+(Math.random()*2-1)*spread)*10)/10;
  for(let i=n;i>=1;i--){
    const dt=new Date(); dt.setDate(dt.getDate()-i); const key=dstr(dt);
    const d=ensureDay(key); const t=S.templates[templateFor(key)];
    d.metrics.sleepH=clamp(jit(t.sleepH,0.9),5,9.5);
    d.metrics.sleepQ=clamp(Math.round(jit(7,1.5)),3,10);
    d.metrics.sitH=clamp(jit(t.sitH,1.5),2,12);
    d.metrics.protein=Math.max(0,Math.round(jit(t.protein,25)));
    d.metrics.workoutDone=Math.random()<(t.workoutDone?0.7:0.3);
    d.metrics.workoutMin=d.metrics.workoutDone?Math.round(jit(40,15)):0;
    d.metrics.mood=clamp(Math.round(jit(7,1.5)),3,10);
    d.metrics.energy=clamp(Math.round(jit(7,1.5)),3,10);
    d.metrics.stress=clamp(Math.round(jit(4,1.5)),1,9);
    d.confirmed=true; d.deviations=[]; d.updatedAt=Date.now()-i*1000;
    d.hebeAge=computeHebeAge(key);
  }
  persist(); render(); toast('Loaded a sample week — explore away');
}
function resetAndReonboard(){
  if(!confirm('Clear this device and start onboarding again? Export a backup first if you want to keep the data.')) return;
  ['hebe_days','hebe_templates','hebe_protocols','hebe_lastreport','hebe_onboarded','hebe_settings'].forEach(k=>localStorage.removeItem(k));
  S.days={}; S.onboarded=false; S.protocols=[];
  S.templates=JSON.parse(JSON.stringify(GUEST_TEMPLATE));
  S.settings.name=''; S.settings.coachBio=OWNER_BIO;
  ob=null;
  render(); showOnboarding();
}

// ---------- boot ----------
loadLocal();
applyTheme();
ensureDay(S.date);
render();
setSync('local');
if(parseFbConfig()) initFirebase();
if(!S.onboarded) showOnboarding();
</script>
</body>
