<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HEBE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F6F3; --card:#FFFFFF; --card2:#F1F1EC; --text:#1E1E1C; --text2:#6B6B65; --text3:#9C9C94;
  --line:rgba(30,30,28,.09); --line2:rgba(30,30,28,.16);
  --teal:#1D9E75; --teal-bg:#E1F5EE; --teal-dk:#085041;
  --purple:#534AB7; --purple-bg:#EEEDFE; --purple-dk:#26215C;
  --amber:#BA7517; --amber-bg:#FAEEDA; --amber-dk:#633806;
  --coral:#D85A30; --coral-bg:#FAECE7; --coral-dk:#4A1B0C;
  --r:12px;
}
html.dark{
  --bg:#141412; --card:#1E1E1B; --card2:#262622; --text:#F0F0EC; --text2:#A6A69E; --text3:#75756E;
  --line:rgba(240,240,236,.09); --line2:rgba(240,240,236,.18);
  --teal:#5DCAA5; --teal-bg:#0B3A2C; --teal-dk:#9FE1CB;
  --purple:#AFA9EC; --purple-bg:#2A2557; --purple-dk:#CECBF6;
  --amber:#EF9F27; --amber-bg:#42300E; --amber-dk:#FAC775;
  --coral:#F0997B; --coral-bg:#47210F; --coral-dk:#F5C4B3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
#app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;letter-spacing:.18em;font-size:17px;padding:0 10px 18px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--text2);cursor:pointer;border:none;background:none;text-align:left;width:100%;font-family:inherit}
.nav-item:hover{background:var(--card2)}
.nav-item.active{background:var(--teal-bg);color:var(--teal-dk);font-weight:600}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-bottom{margin-top:auto}
.syncrow{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text3);padding:6px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
main{padding:22px 26px 90px;max-width:1060px;width:100%;margin:0 auto}
.topline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.topline .l{font-size:13.5px;color:var(--text2)}
.topline .r{font-size:12px;color:var(--text3)}
.proto-pill{display:inline-block;background:var(--amber-bg);color:var(--amber-dk);border-radius:99px;padding:1px 10px;font-size:11.5px;margin-left:8px}
.catchup-pill{display:inline-block;background:var(--purple-bg);color:var(--purple-dk);border-radius:99px;padding:1px 10px;font-size:11.5px;margin-left:8px;font-weight:600}
.fork{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.fork-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
.fork-row .lab{color:var(--text2)}
.fork-row .val{font-weight:700;font-variant-numeric:tabular-nums}
.fork-hold .val{color:var(--text2)}
.fork-fix .val{color:var(--teal-dk)}
.fork-gain{margin-top:9px;font-size:12.5px;line-height:1.5;color:var(--teal-dk);background:var(--teal-bg);border-radius:9px;padding:8px 11px}
.onemove{background:linear-gradient(180deg,var(--purple-bg),var(--card));border:1px solid var(--purple);border-radius:var(--r);padding:15px 18px;margin-top:14px;display:flex;gap:14px;align-items:flex-start}
.onemove .ic{flex-shrink:0;width:34px;height:34px;border-radius:9px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center}
.onemove .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--purple-dk);font-weight:700}
.onemove .k .sub2{font-weight:500;text-transform:none;letter-spacing:0;color:var(--text3)}
.onemove .mv{font-size:16px;font-weight:700;margin-top:2px;line-height:1.3}
.onemove .wy{font-size:12.5px;color:var(--text2);margin-top:3px;line-height:1.45}
.onemove .worth{margin-left:auto;text-align:right;flex-shrink:0}
.onemove .worth .n{font-size:20px;font-weight:800;color:var(--purple-dk);line-height:1;font-variant-numeric:tabular-nums}
.onemove .worth .u{font-size:10.5px;color:var(--text2);display:block;margin-top:2px}
.datenav{display:inline-flex;align-items:center;gap:4px}
.dnav{border:1px solid var(--line2);background:var(--card);color:var(--text2);border-radius:8px;font-family:inherit;font-size:13px;line-height:1;padding:3px 8px;cursor:pointer}
.dnav:hover:not(:disabled){border-color:var(--teal);color:var(--teal-dk)}
.dnav:disabled{opacity:.32;cursor:default}
.dnav.today{font-size:11.5px;padding:4px 9px;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.tile .k{font-size:11.5px;color:var(--text2)}
.tile .v{font-size:19px;font-weight:600;margin-top:1px}
.tile .s{font-size:11px;margin-top:1px;color:var(--text3)}
.grid2{display:grid;grid-template-columns:5fr 4fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid2eq{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mt{margin-top:14px}
h2{font-size:16px;font-weight:650;margin:0 0 10px}
h3{font-size:13.5px;font-weight:600;margin:0}
.sub{font-size:12px;color:var(--text2)}
.hero-num{font-size:54px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:500}
.badge.teal{background:var(--teal-bg);color:var(--teal-dk)}
.badge.coral{background:var(--coral-bg);color:var(--coral-dk)}
.badge.gray{background:var(--card2);color:var(--text2)}
.badge.purple{background:var(--purple-bg);color:var(--purple-dk)}
.badge.tierb{font-size:11px;padding:2px 9px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.est-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.est-head h3{margin:0}
.zone-row .zone-range{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ob-dots{display:flex;gap:6px;margin-bottom:14px}.ob-dots span{width:22px;height:4px;border-radius:2px;background:var(--line2)}.ob-dots span.on{background:var(--teal)}
.ob-truth{display:flex;gap:10px;margin-top:10px;font-size:13px;line-height:1.5}.ob-truth b{display:block}
.ob-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}.ob-row:last-child{border-bottom:none}
.ob-row input{width:84px;padding:5px 8px;font-size:13px;text-align:right}.ob-row select{padding:5px 8px;font-size:12.5px}
.ob-row .tag{font-size:10.5px;color:var(--text3)}.ob-row .tag.heard{color:var(--teal-dk)}
.ob-nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px;position:sticky;bottom:-22px;background:var(--card);padding:10px 0 22px;margin-bottom:-22px}
.ob-lock{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:12.5px;line-height:1.45}
.ob-group{margin-top:12px}.ob-group .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--text2);margin-bottom:4px}
textarea.ob{min-height:74px;resize:vertical;line-height:1.45}
.coach-tag{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--purple);font-weight:600}
.coach-tag svg{width:16px;height:16px;flex-shrink:0}
.insight svg{width:17px;height:17px;flex-shrink:0}
button.btn{font-family:inherit;font-size:13px;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--text)}
button.btn:hover{background:var(--card2)}
button.btn.primary{background:var(--teal-bg);color:var(--teal-dk);border-color:transparent;font-weight:600}
button.btn.danger{background:var(--coral-bg);color:var(--coral-dk);border-color:transparent}
button.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);color:var(--text2);cursor:pointer;background:var(--card);font-family:inherit}
.chip.on{background:var(--teal-bg);color:var(--teal-dk);border-color:transparent;font-weight:600}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--teal)}
label.f{font-size:11.5px;color:var(--text2);display:block;margin-bottom:3px}
.frow{display:flex;gap:10px;align-items:end}
.frow>div{flex:1}
.insight{background:var(--purple-bg);border-radius:var(--r);padding:12px 15px;display:flex;gap:10px;align-items:flex-start}
.insight .t{font-size:11.5px;color:var(--purple);font-weight:600}
.insight .b{font-size:13px;color:var(--purple-dk);line-height:1.45;margin-top:1px}
/* --- UX refinement: read line, slim check-in bar, expand-on-tap reveals --- */
.readline{font-size:14.5px;line-height:1.45;font-weight:650;margin-top:10px;padding-left:10px;border-left:3px solid var(--teal)}
.readline.up{border-left-color:var(--coral)}
.readline.flat{border-left-color:var(--line2);font-weight:600;color:var(--text2)}
.checkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 15px;margin-top:14px}
.checkbar.done{background:var(--teal-bg)}
.checkbar .q{font-size:13.5px;font-weight:600}
.checkbar .sub2{font-weight:400;color:var(--text2);font-size:12px}
/* Home top block. Desktop is the original grid2 (5fr/4fr, 14px gap) with the
   check-in bar and ONE MOVE spanning full width beneath it — unchanged. The only
   reason they live inside the grid is so the mobile rules below can reorder them
   ahead of the coach card. */
.homeTop>.ht-check,.homeTop>.ht-move{grid-column:1/-1}
.homeTop .checkbar,.homeTop .onemove{margin-top:0}
/* Continuation of the one-move spine inside the debrief — deliberately quiet, so
   it reads as the same instruction carried forward, not a competing directive. */
.carry{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.carry .lab{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--text3);flex-shrink:0}
.carry .b{font-size:12.5px;line-height:1.5;color:var(--text2);flex:1;min-width:180px}
.reveal{margin-top:10px}
.reveal>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--text2);padding:9px 0;border-top:1px solid var(--line)}
.reveal>summary::-webkit-details-marker{display:none}
.reveal>summary::after{content:'\25B8';margin-left:auto;color:var(--text3);transition:transform .2s}
.reveal[open]>summary::after{transform:rotate(90deg)}
.reveal>summary .sub2{font-weight:500;text-transform:none;letter-spacing:0;color:var(--text3)}
.reveal .fork{border-top:none;margin-top:2px;padding-top:0}
.foodrow{padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.flag{display:inline-block;font-size:11px;background:var(--coral-bg);color:var(--coral-dk);border-radius:99px;padding:2px 9px;margin:2px 3px 0 0}
.scorepill{font-weight:700;font-size:13.5px;border-radius:99px;padding:3px 11px}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.list-item:last-child{border-bottom:none}
canvas{max-width:100%}
.chartbox{position:relative;height:210px}
.chartbox.tall{height:260px}
.range-tabs{display:inline-flex;background:var(--card2);border-radius:9px;padding:3px;gap:2px}
.range-tabs button{border:none;background:none;font-family:inherit;font-size:12px;padding:5px 12px;border-radius:7px;color:var(--text2);cursor:pointer}
.range-tabs button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 16px;font-size:13px;display:none;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:16px;padding:22px;max-width:430px;width:100%;max-height:85vh;overflow-y:auto}
nav.bottom{display:none}
@media (max-width:880px){
  #app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:16px 14px 96px}
  .grid2,.grid2eq{grid-template-columns:1fr}
  /* locked Home hierarchy on a phone: age+read → check-in → one move → the read-it-later debrief */
  .homeTop{display:flex;flex-direction:column;gap:14px}
  .homeTop>.ht-hero{order:1}
  .homeTop>.ht-check{order:2}
  .homeTop>.ht-move{order:3}
  .homeTop>.ht-coach{order:4}
  .grid4{grid-template-columns:repeat(2,1fr)}
  nav.bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:50}
  nav.bottom button{border:none;background:none;font-family:inherit;font-size:10px;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav.bottom button.active{color:var(--teal)}
  nav.bottom svg{width:20px;height:20px}
  .hero-num{font-size:46px}
}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- usual meals ---- */
.mealList{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.mealRow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card2);border-radius:10px;padding:9px 12px}
.mealRow .mn{flex:1;min-width:120px;font-size:13px}
.mealRow .mn .sub2{font-size:11px;color:var(--text2);margin-top:2px;font-weight:400}
.mealRow .ms{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--teal);white-space:nowrap}
.mealRow .ms i{font-size:10px;font-weight:600;color:var(--text3);font-style:normal}
/* ---- week planner ---- */
.planWeek{display:flex;flex-direction:column;gap:6px;margin-top:11px}
.planDay{background:var(--card2);border-radius:10px;padding:8px 11px;margin-top:6px}
.planDay.today{outline:1px solid var(--teal)}
.planDay .pdh{display:flex;align-items:baseline;gap:7px;font-size:12.5px}
.planDay .pdh .pdt{margin-left:auto;font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--text3)}
.planDay .pdslots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.planDay .pdfast{margin-top:4px;font-size:11.5px;color:var(--text2)}
.planSel{font-family:inherit;font-size:12px;padding:5px 7px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--text);max-width:100%;min-width:0;flex:1 1 140px}
.planSel.add{color:var(--text2);border-style:dashed}
/* ---- provenance ---- */
.provtag{font-size:10px;letter-spacing:.03em;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--text2);white-space:nowrap;cursor:help}
.provtag.sensor{color:var(--purple-dk);border-color:var(--purple);background:var(--purple-bg)}
.scorehero .provtag{align-self:center}
.scorehead .provtag{margin-left:8px}
/* ---- score v2: the hero ---- */
.scorehero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.scorehero .hm{font-size:17px;color:var(--text3);font-weight:600;margin-left:-4px}
.scorehero .badge{margin-left:6px;white-space:nowrap}
.scoreage .badge{white-space:nowrap;margin-left:auto}
.scoreband{font-size:14.5px;font-weight:650;margin-top:7px;line-height:1.4}
.scoreband .sub2{font-weight:500;color:var(--text2)}
.scorereveal{font-size:13px;font-weight:650;margin-top:8px;padding:7px 11px;border-radius:9px;background:var(--card2);display:inline-block}
.scorereveal.up{background:var(--teal-bg);color:var(--teal-dk)}
.scorereveal.down,.scorereveal.flat{background:var(--card2);color:var(--text2)}
.scoreage{font-size:12.5px;color:var(--text2);margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.scoreage b{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.scoreage .sub,.scoreage .sub2{font-size:12px}
.scoreunlock{margin-top:10px;padding:9px 11px;border-radius:9px;background:var(--teal-bg);border:1px solid var(--line2);font-size:12.5px;font-weight:650;color:var(--teal-dk);line-height:1.5}
.scoreunlock .sub2{font-weight:500;color:var(--text2)}
.onemove .omlabel{font-size:11px;color:var(--text3);margin-top:4px}
@media (max-width:880px){.scoreage{font-size:12px}}

/* ---- the score ---- */
.scorechip{display:inline-flex;align-items:baseline;gap:3px;background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:3px 11px;cursor:pointer;transition:border-color .15s,background .15s;vertical-align:middle}
.scorechip:hover{border-color:var(--teal);background:var(--teal-bg)}
.scorechip .n{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.scorechip .d{font-size:10px;color:var(--text3)}
.scorechip .l{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);font-weight:700;margin-left:3px}
.scorehead{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.scorehead .sv{display:flex;align-items:baseline;gap:3px}
.scorehead .sv .n{font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.scorehead .sv .d{font-size:14px;color:var(--text3)}
.scorehead .sm{min-width:0}
.scorehead .band{font-size:13px;font-weight:650}
.scorehead .move{font-size:11.5px;margin-top:3px;display:flex;align-items:center;gap:4px;color:var(--text2)}
.scorehead .move.up{color:var(--teal)}
.scorehead .move.down{color:var(--coral)}
.scorehead .move svg{width:13px;height:13px}
.scorelevers{margin-top:13px;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px}
.srow .sn{font-size:12px;font-weight:600;min-width:104px;flex-shrink:0}
.srow .sb{position:relative;flex:1;min-width:60px;height:7px;background:var(--card2);border-radius:4px}
.srow .sb u{position:absolute;left:50%;top:-2px;width:1px;height:11px;background:var(--line2)}
.srow .sb i{position:absolute;top:0;height:100%;border-radius:4px}
.srow .sb i.pos{background:var(--teal)}
.srow .sb i.neg{background:var(--coral)}
.srow .sb i.zero{background:transparent}
.srow .sp{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right;color:var(--text3)}
.srow .sp.pos{color:var(--teal)}
.srow .sp.neg{color:var(--coral)}
.scorefoot{font-size:10.5px;margin-top:9px;line-height:1.45}
@media (max-width:880px){.srow .sn{min-width:86px;font-size:11.5px}.scorehead .sv .n{font-size:36px}}

/* ---- body map ---- */
.bodymap .bm-sys{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.bm-syschip.locked{opacity:.78}
.bm-wrap{display:grid;grid-template-columns:minmax(140px,210px) 1fr;gap:16px;margin-top:13px;align-items:start}
.bm-figure{position:relative}
#bmSvg{width:100%;max-width:168px;height:auto;display:block;margin:0 auto}
.bm-sil path{fill:var(--card2);stroke:var(--line);stroke-width:1;transition:fill .35s ease,fill-opacity .35s ease}
.bm-r{stroke:transparent;stroke-width:0;cursor:pointer;transition:fill-opacity .35s ease,fill .35s ease,stroke .15s,stroke-width .15s}
.bm-r:hover,.bm-r.sel{stroke:var(--text2);stroke-width:1.6}
.bm-view{display:flex;gap:6px;justify-content:center;margin-top:8px}
.bm-side{min-width:0;display:flex;flex-direction:column;gap:11px}
.bm-blurb{font-size:12.5px;line-height:1.5;color:var(--text2)}
.bm-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--text2)}
.bm-legend span{display:flex;align-items:center;gap:5px}
.bm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.bm-inspect{background:var(--card2);border-radius:10px;padding:11px 13px;min-height:76px}
.bm-inspect .t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.bm-inspect .tier{font-size:10px;font-weight:700;color:var(--text3);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.bm-inspect .bar{height:5px;border-radius:3px;background:var(--line);margin:8px 0 7px;overflow:hidden}
.bm-inspect .bar i{display:block;height:100%;background:var(--teal);transition:width .35s ease}
.bm-inspect .b{font-size:11.5px;line-height:1.5;color:var(--text2)}
.bm-inspect .b.dim{color:var(--text3)}
.bm-inspect .p{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bm-inspect .p span{font-size:10.5px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--text2)}
.bm-gaps .t{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--amber-dk)}
.bm-gaps .b{font-size:12px;line-height:1.5;color:var(--text2);margin-top:3px}
.bm-lock{background:var(--amber-bg);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.bm-lock .t{font-size:12.5px;font-weight:700;color:var(--amber-dk)}
.bm-lock .b{font-size:12px;line-height:1.55;color:var(--text2);margin-top:5px}
.bm-time{display:flex;align-items:center;gap:11px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bm-time input[type=range]{flex:1;min-width:0;accent-color:var(--teal)}
.bm-date{font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums;min-width:98px;text-align:right}
.bm-foot{font-size:10.5px;line-height:1.45;margin-top:8px}
@media (max-width:880px){.bm-wrap{grid-template-columns:1fr}#bmSvg{max-width:148px}.bm-date{min-width:76px}}

/* ---- nutrition merge ---- */
.logrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.logrow input[type=text]{flex:1;min-width:150px}
.logrow select{flex:1;min-width:150px;font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--text)}
.qty{width:110px;flex:0 0 auto}
.estbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);cursor:pointer;white-space:nowrap}
.estbox input{width:auto;margin:0}
.logsub{font-size:11px;color:var(--text3);margin:12px 0 6px;letter-spacing:.03em;text-transform:uppercase}
.esttag{font-weight:500;font-size:9.5px;color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:1px;text-transform:none;letter-spacing:0}
.foodrow.est{opacity:.82}
.scorepill.whole{background:var(--teal-bg);color:var(--teal);font-size:10.5px}
.macrogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px}
.macrocell{background:var(--card2);border-radius:10px;padding:11px 12px}
.macroval{font-size:22px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.nbar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.nbar i{display:block;height:100%;border-radius:2px;background:var(--text3)}
.nbar i.ok{background:var(--teal)} .nbar i.mid{background:var(--amber)} .nbar i.low{background:var(--coral)}
.nutgrp{font-size:11px;color:var(--text3);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);letter-spacing:.03em;text-transform:uppercase}
.nutrow{padding:10px 0;border-bottom:1px solid var(--line)}
.nutrow:last-of-type{border-bottom:none}
.nuthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;cursor:pointer}
.nutname{font-weight:600;font-size:13.5px}
.nutfig{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
.nutfig b{color:var(--text);font-weight:600}
.unk{color:var(--amber);font-size:10.5px}
.nutdet{font-size:12.5px;color:var(--text2);margin-top:8px;display:none;line-height:1.65}
.nutrow.open .nutdet{display:block}
.nutdet em{font-style:normal;color:var(--text);font-weight:600}
.lexcard summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none}
.lexcard summary::-webkit-details-marker{display:none}
.lexcard summary:before{content:'▸ ';color:var(--text3)}
.lexcard[open] summary:before{content:'▾ '}
.lexgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:3px 20px;font-size:12.5px;margin-top:12px}
.lexgrid div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}
.covline{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.covbig{font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.lnk{cursor:pointer;border-bottom:1px solid var(--line2)}
.lnk:hover{color:var(--teal)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:4px}
.seg button{border:none;background:var(--card2);color:var(--text3);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--teal-bg);color:var(--teal)}
.portgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.portchip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;font-family:inherit;text-align:left;transition:border-color .15s,background .15s}
.portchip:hover{border-color:var(--teal)}
.portchip.on{border-color:var(--teal);background:var(--teal-bg)}
.pico{font-size:19px;line-height:1.1}
.plab{font-size:13px;font-weight:600;color:var(--text)}
.pof{font-size:10.5px;color:var(--text3);line-height:1.3}
.pcount{position:absolute;top:8px;right:9px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.portsum{margin-top:10px;font-size:12.5px;color:var(--text2)}
.portsum b{color:var(--text);font-variant-numeric:tabular-nums}
button.pclear{background:none;border:none;color:var(--text3);font-family:inherit;font-size:12px;padding:0 0 0 6px;cursor:pointer}
button.pclear:hover{color:var(--coral)}

.seg.lang{margin-bottom:0;flex-shrink:0}
.seg.lang button{padding:5px 11px;font-size:11.5px;letter-spacing:.04em}
</style>
</head>

<script>
'use strict';
/* ================= HEBE — v2 ================= */

const DEFAULT_API_KEY = ''; // never commit a real key — paste it in Setup instead (saved per device)
const DOB_DEFAULT = '2001-02-05';
// Owner's coach profile (used to build the AI coach prompt). Guests get their own
// generated at onboarding. Keeping the owner's here preserves his exact coach.
const OWNER_BIO = 'one athlete (25, trains fasted, bikes ~1.5h/day commuting, gym 4x/wk alternating core/arms + heavy compounds, Friday sauna + cold shower, eats two meals a day - morning + evening, main meal ~7pm: salmon+eggs+legumes, no dairy except hard aged cheese (Grana Padano/Parmigiano), avoids sun deliberately so vitamin D comes from food, whey+creatine+omega3+vitD, sleeps ~7h, weekend fasting protocol active some weeks, goal is muscle growth)';
// Share links surfaced to guests. Fill linkedin to show the "follow the build" link.
const LINKS = { github:'https://github.com/KanishTuteja/hebe', linkedin:'' };
// Generic starting templates for a brand-new guest (no cycling/fasting rituals).
const GUEST_TEMPLATE = {
  weekday:{ sleepH:7.5, sleepQ:7, workoutDone:false, workoutMin:0, rideH:0, sitH:8, sunMin:15, protein:90, water:2, supplements:false, mood:7, energy:7, stress:4, fastingH:12 },
  weekend:{ sleepH:8, sleepQ:7, workoutDone:false, workoutMin:0, rideH:0, sitH:5, sunMin:25, protein:90, water:2, supplements:false, mood:7, energy:7, stress:3, fastingH:12 }
};

const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H3l9-9 9 9h-2M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/><path d="M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"/></svg>',
  perf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>',
  fuel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4 0-7-3-7-7 0-3 2-6 7-11 5 5 7 8 7 11 0 4-3 7-7 7z"/></svg>',
  body:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 13.5 12 21l-7.5-7.5a5 5 0 1 1 7.5-6.5 5 5 0 1 1 7.5 6.5z"/><path d="M3 12h4l2-3 3 6 2-3h7"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 15v-3M12 15V9M17 15v-6"/></svg>',
  setup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 3.6 10.8 3.5 3.5 0 0 0-1.1 2.2H9.5a3.5 3.5 0 0 0-1.1-2.2A6 6 0 0 1 12 3z"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M21 11v6h-6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 13V7h-6"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8z"/></svg>'
};

const CHIPS = [
  { id:'skipGym',   label:'Skipped gym',      apply:m=>{m.workoutDone=false;m.workoutMin=0;} },
  { id:'noRide',    label:'No ride',          apply:m=>{m.rideH=0;} },
  { id:'sleptLess', label:'Slept less',       apply:m=>{m.sleepH=Math.max(4,m.sleepH-1.5);m.sleepQ=Math.max(1,m.sleepQ-1);} },
  { id:'sleptMore', label:'Slept more',       apply:m=>{m.sleepH=m.sleepH+1;} },
  { id:'ateOff',    label:'Ate off-plan',     apply:m=>{m.protein=Math.max(0,m.protein-20);} },
  { id:'extraMeal', label:'Extra meal',       apply:m=>{m.protein=m.protein+30;m.fastingH=Math.max(0,m.fastingH-4);} },
  { id:'stressDay', label:'Stressful day',    apply:m=>{m.stress=Math.min(10,m.stress+4);m.mood=Math.max(1,m.mood-2);} },
  { id:'lowEnergy', label:'Low energy',       apply:m=>{m.energy=Math.max(1,m.energy-3);} },
];

const JUNK = [
  { rx:/sucralose/i, name:'sucralose', why:'artificial sweetener linked to gut microbiome disruption' },
  { rx:/aspartame/i, name:'aspartame', why:'artificial sweetener, controversial long-term data' },
  { rx:/acesulfame/i, name:'acesulfame-K', why:'artificial sweetener' },
  { rx:/high[- ]fructose corn syrup|glucose[- ]fructose/i, name:'high-fructose corn syrup', why:'strongly tied to metabolic disease' },
  { rx:/corn syrup/i, name:'corn syrup', why:'refined sugar' },
  { rx:/maltodextrin/i, name:'maltodextrin', why:'high-glycemic filler' },
  { rx:/dextrose/i, name:'dextrose', why:'refined sugar' },
  { rx:/\bcane sugar|\bsugar\b|sucrose/i, name:'added sugar', why:'added sugar' },
  { rx:/hydrogenated/i, name:'hydrogenated oil', why:'trans-fat risk' },
  { rx:/palm oil|palm fat/i, name:'palm oil', why:'highly processed saturated fat' },
  { rx:/soy(bean)? oil/i, name:'soybean oil', why:'refined seed oil, omega-6 heavy' },
  { rx:/canola|rapeseed oil/i, name:'canola oil', why:'refined seed oil' },
  { rx:/sunflower oil/i, name:'sunflower oil', why:'refined seed oil' },
  { rx:/cottonseed oil/i, name:'cottonseed oil', why:'refined seed oil' },
  { rx:/vegetable oil/i, name:'vegetable oil', why:'unspecified refined seed oil' },
  { rx:/natural flavou?r/i, name:'natural flavors', why:'catch-all hiding unknown additives' },
  { rx:/artificial flavou?r/i, name:'artificial flavors', why:'synthetic flavoring' },
  { rx:/red 40|allura|yellow 5|tartrazine|blue 1|red 3|artificial colou?r/i, name:'artificial colors', why:'synthetic dyes' },
  { rx:/caramel colou?r/i, name:'caramel color', why:'processed coloring' },
  { rx:/sodium nitrite|sodium nitrate/i, name:'nitrites/nitrates', why:'processed-meat preservative, cancer-risk link' },
  { rx:/\bbha\b|\bbht\b|tbhq/i, name:'BHA/BHT/TBHQ', why:'synthetic preservatives' },
  { rx:/monosodium glutamate|\bmsg\b/i, name:'MSG', why:'flavor enhancer' },
  { rx:/carrageenan/i, name:'carrageenan', why:'thickener linked to gut inflammation' },
  { rx:/polysorbate/i, name:'polysorbate', why:'emulsifier, may disrupt gut lining' },
  { rx:/sodium benzoate/i, name:'sodium benzoate', why:'preservative' },
  { rx:/titanium dioxide/i, name:'titanium dioxide', why:'whitener banned in EU foods' },
  { rx:/mono-? and diglycerides/i, name:'mono/diglycerides', why:'emulsifier' },
];

const TEMPLATE_DEFAULTS = {
  weekday: { sleepH:7, sleepQ:7, workoutDone:true, workoutMin:60, rideH:1.75, sitH:7, sunMin:40, protein:138, water:2.5, supplements:true, mood:7, energy:7, stress:3, fastingH:19.5 },
  weekend: { sleepH:8, sleepQ:7, workoutDone:false, workoutMin:0, rideH:0, sitH:6, sunMin:20, protein:120, water:2.5, supplements:true, mood:7, energy:7, stress:2, fastingH:14 }
};
const METRIC_FIELDS = Object.keys(TEMPLATE_DEFAULTS.weekday);

// ---------- state ----------
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => dstr(new Date());

let S = {
  page:'home', date:todayStr(), trendRange:30,
  days:{},
  settings:{ dob:DOB_DEFAULT, name:'Kanish', apiKey:DEFAULT_API_KEY, model:'claude-sonnet-5', proteinTarget:135, sex:'male', lang:'', theme:'light', fbConfig:'', coachBio:OWNER_BIO },
  onboarded:true,
  templates: JSON.parse(JSON.stringify(TEMPLATE_DEFAULTS)),
  protocols: [],
  meals: {},                                                // usual meals, by id
  plan: { mealTpl:{ weekday:[], weekend:[] }, weeks:{} },   // the week plan
  lastWorkoutType:'core',
  fb:{ app:null, db:null, user:null, status:'local' },
  coachCache:{},
};
let charts = {}, saveTimer=null, checkinOpen=false, activeChips=new Set();

function defaultProtocols(){
  // 4-week weekend-fasting block anchored to the current weekend:
  // on Sunday, back up to yesterday's Saturday; otherwise use this week's Saturday
  const now = new Date();
  const dow = now.getDay();
  const sat = new Date(now); sat.setDate(sat.getDate() + (dow===0 ? -1 : (6-dow)));
  const end = new Date(sat); end.setDate(end.getDate() + 22); // covers 4 weekends
  return [{ id:'fast4', name:'Weekend fasting', type:'fasting', days:[0,6], start:dstr(sat), end:dstr(end), note:'Full-day fasts Sat + Sun for 4 weeks.' }];
}

function loadLocal(){
  try{ S.days = JSON.parse(localStorage.getItem('hebe_days')||'{}'); }catch(e){ S.days={}; }
  // A returning user has saved data; a brand-new visitor has none → guest onboarding.
  // The owner is protected: any existing days/settings/onboarded flag counts as onboarded.
  const hasData = !!localStorage.getItem('hebe_days') || !!localStorage.getItem('hebe_settings') || Object.keys(S.days).length>0;
  S.onboarded = localStorage.getItem('hebe_onboarded')==='1' || hasData;
  try{ Object.assign(S.settings, JSON.parse(localStorage.getItem('hebe_settings')||'{}')); }catch(e){}
  if(!S.settings.coachBio) S.settings.coachBio = OWNER_BIO;
  try{ const t = JSON.parse(localStorage.getItem('hebe_templates')||'null'); if(t) S.templates=t; else if(!S.onboarded) S.templates=JSON.parse(JSON.stringify(GUEST_TEMPLATE)); }catch(e){}
  // Owner keeps the weekend-fasting protocol default; guests start with none.
  try{ const p = JSON.parse(localStorage.getItem('hebe_protocols')||'null'); S.protocols = p || (S.onboarded ? defaultProtocols() : []); }catch(e){ S.protocols = S.onboarded?defaultProtocols():[]; }
  try{ S.lastWorkoutType = localStorage.getItem('hebe_lastwt')||'core'; }catch(e){}
  try{ const mm = JSON.parse(localStorage.getItem('hebe_meals')||'null'); if(mm) S.meals = mm; }catch(e){}
  try{ const pl = JSON.parse(localStorage.getItem('hebe_plan')||'null'); if(pl) S.plan = Object.assign(S.plan, pl); }catch(e){}
  if(!S.settings.apiKey) S.settings.apiKey = DEFAULT_API_KEY;
}
function persist(){
  localStorage.setItem('hebe_days', JSON.stringify(S.days));
  localStorage.setItem('hebe_settings', JSON.stringify(S.settings));
  localStorage.setItem('hebe_templates', JSON.stringify(S.templates));
  localStorage.setItem('hebe_protocols', JSON.stringify(S.protocols));
  localStorage.setItem('hebe_lastwt', S.lastWorkoutType);
  localStorage.setItem('hebe_meals', JSON.stringify(S.meals||{}));
  localStorage.setItem('hebe_plan', JSON.stringify(S.plan||{}));
  if(S.onboarded) localStorage.setItem('hebe_onboarded','1');
}

// ---------- rituals engine ----------
function templateFor(date){

function activeProtocol(date){

function protocolWeek(p, date){

function ensureDay(date){

function saveDay(date){

  // and updatedAt cannot answer that: every edit moves it. Engine never reads it.
  if(!(d.updatedAt>0) && !d.confirmedAt) d.confirmedAt = Date.now();

// Side-feature write (heart readings, food entries, weight): persists and syncs

// hebeAge is an EMA chained off the previous logged day, so a day logged out of

  (chain.length ? chain : [date]).forEach(k=>{
    const d = S.days[k]; if(!d) return;
    d.hebeAge = computeHebeAge(k);

function confirmedDates(before){

// ---------- catch-up (logging days you missed) ----------

// So: any unlogged past day inside the rolling window is offered for backfill.
const CATCHUP_WINDOW = 14;
function missedDates(){
  const logged = confirmedDates();
  if(!logged.length) return [];              // nothing to catch up on before your first log
  const first = logged[0], today = todayStr(), out = [];
  for(let i=1;i<=CATCHUP_WINDOW;i++){
    const dt = new Date(today+'T12:00:00'); dt.setDate(dt.getDate()-i);
    const k = dstr(dt);
    if(k < first) break;
    if(!S.days[k] || !S.days[k].confirmed) out.push(k);
  }
  return out.reverse();                      // oldest first
}
function goToDate(k){

}
function shiftDate(n){

}
// Backfill every missed day straight from its template — the bulk version of

  if(!confirm('Log '+missed.length+' missed day'+(missed.length>1?'s':'')+' from your templates?\nEach one stays editable — open it from the date arrows to adjust.')) return;
  missed.forEach(k=>{ const d=ensureDay(k); d.confirmed=true; d.backfilled=true;
    if(!(d.updatedAt>0) && !d.confirmedAt) d.confirmedAt=Date.now();   // same rule as saveDay
    d.updatedAt=Date.now(); });

  persist(); missed.forEach(cloudPush); render();

// ---------- HEBE age engine ----------
function chronoAge(date){
  const dob = new Date((S.settings.dob||DOB_DEFAULT)+'T12:00:00');
  return (new Date(date+'T12:00:00') - dob) / (365.2425*864e5);
}
function windowStats(date, span){
  const dates = confirmedDates(date).slice(-span);
  if(!dates.length) return null;
  const st = { n:dates.length, sleepH:0, sleepQ:0, trainH:0, liftDays:0, sitH:0, stress:0, mood:0, food:[], rhr:[] };
  dates.forEach(k=>{
    const d = S.days[k], m = d.metrics;
    st.sleepH+=m.sleepH; st.sleepQ+=m.sleepQ; st.trainH += m.rideH + (m.workoutMin||0)/60;
    if(m.workoutDone) st.liftDays++;
    st.sitH+=m.sitH; st.stress+=m.stress; st.mood+=m.mood;
    (d.foods||[]).forEach(f=>{ if(typeof f.score==='number') st.food.push(f.score); });
    const r = d.heart&&d.heart.rhr || d.wearable&&d.wearable.restingHR; if(r) st.rhr.push(r);
  });
  ['sleepH','sleepQ','trainH','sitH','stress','mood'].forEach(k=> st[k]/=st.n);
  st.liftPerWk = st.liftDays/st.n*7;
  st.foodAvg = st.food.length ? st.food.reduce((a,b)=>a+b,0)/st.food.length : null;
  st.rhrAvg = st.rhr.length ? st.rhr.reduce((a,b)=>a+b,0)/st.rhr.length : null;
  return st;
}
const clamp = (v,lo,hi)=>Math.max(lo,Math.min(hi,v));
// Age-equivalent conversion (Gompertz): adult all-cause mortality doubles
// ~every 8y, so Δage = ln(HR)/0.0866 = 11.55·ln(HR). Every coefficient below
// is derived from a published all-cause-mortality meta-analysis — see
// HEBE_ACCURACY.md for the studies, hazard ratios and the arithmetic.
function ageAdjustments(st){
  if(!st) return { total:0, parts:[] };
  const parts = [];

  // SLEEP — Yin et al. 2017 (JAHA, dose-response meta-analysis, 1.38M people):
  // U-shaped, lowest risk at ~7h, RR 1.06 per hour BELOW 7h and RR 1.13 per hour
  // ABOVE 7h. Through the Gompertz factor used throughout this file
  // (11.55·ln(RR)) those reproduce as 0.673 y/h and 1.412 y/h.
  //
  // The previous curve used 0.22 y/h below 7h, which UNDER-penalised short sleep
  // against its own cited source by a factor of three: 4h/night scored +0.56
  // while 9.5h scored +2.02, so chronic four-hour nights read 3.6x safer than
  // oversleeping by 2.5h. That was backwards in effect, though not in intent.
  //
  // ⚠ THE 7–9h FLAT BAND IS A MODELLING CHOICE, NOT A FINDING. Yin's curve is a
  // point-minimum at 7h — 8h is already elevated in the paper. Flattening 7–9h is
  // justified by two things outside Yin: the AASM 7–9h recommended band, and the
  // well-documented reverse-causation problem in the long-sleep association
  // (illness causes long sleep at least as much as the reverse), which makes
  // applying the full published gradient as if it were causal an overstatement.
  // So this lever is "Yin below 7h and above 9h, with an evidence-informed flat
  // band between" — NOT pure Yin. Attributing the flat band to Yin would break
  // the same honesty rule this fix exists to protect.
  //
  // Ref ~6.7h (population median) offset via -0.10, unchanged.
  const sleep = st.sleepH < 7  ? (7-st.sleepH)*0.67 - 0.10
              : st.sleepH > 9  ? (st.sleepH-9)*1.41 - 0.10
              :                  -0.10;
  parts.push(['Sleep', clamp(sleep, -0.3, 2.5)]);

  // TRAINING VOLUME — cardiorespiratory fitness / activity. ~13% lower
  // mortality per MET (HR0.87 → -1.6y/MET); benefit plateaus past guidelines.
  // Bonus-only, ref = meets guideline (~0.7h/day activity).
  parts.push(['Training volume', -Math.min(2.2, Math.max(0, st.trainH-0.7)*1.3)]);

  // STRENGTH — resistance training's effect INDEPENDENT of aerobic: ≥2×/wk
  // HR0.92 → ~-1.0y (joint-effects cohort). Bonus-only.
  parts.push(['Strength', st.liftPerWk>=3 ? -0.75 : (st.liftPerWk>=1.5 ? -0.5 : (st.liftPerWk>=0.5?-0.25:0))]);

  // SITTING — HR1.03 per hour above ~8h threshold (→ +0.34y/h), strongly
  // attenuated in the highly active (JACC 2019). Ref 8h.
  parts.push(['Sitting', clamp(st.sitH>8 ? (st.sitH-8)*0.30*(st.trainH>1?0.6:1) : 0, 0, 1.2)]);

  // FOOD QUALITY — highest-vs-lowest ultra-processed intake HR~1.18
  // (→ ~1.9y full swing). Ingredient score 0-100 mapped around ref 65.
  parts.push(['Food quality', st.foodAvg!=null ? clamp((65-st.foodAvg)*0.03, -1.5, 1.5) : 0]);

  // RESTING HR — HR1.09 per +10bpm (→ ~+1.0y/10bpm, 1.25M people). Ref 65bpm.
  parts.push(['Resting HR', st.rhrAvg!=null ? clamp((st.rhrAvg-65)*0.10, -1.5, 1.5) : 0]);

  // STRESS — chronic psychological stress ~HR1.1-1.2; modest + self-reported.
  parts.push(['Stress', st.stress>6 ? 0.6 : (st.stress>4?0.3:0)]);

  // Total capped ±6y: lifestyle extremes span ~12y of life expectancy
  // (Li et al., Circulation 2018), so ±6 around the mean is the honest ceiling.
  const total = clamp(parts.reduce((a,p)=>a+p[1],0), -6, 6);
  return { total, parts };
}
function computeHebeAge(date){
  const chrono = chronoAge(date);
  const st = windowStats(date, 21);
  const raw = chrono + ageAdjustments(st).total;
  // EMA smoothing against previous confirmed day
  const prev = confirmedDates(date).filter(k=>k<date).pop();
  const prevAge = prev && S.days[prev].hebeAge!=null ? S.days[prev].hebeAge : null;
  const smoothed = prevAge!=null ? prevAge + 0.25*(raw-prevAge) : raw;
  return Math.round(smoothed*100)/100;
}
function ageTrendPerMonth(date){
  const dates = confirmedDates(date).filter(k=>S.days[k].hebeAge!=null);
  if(dates.length<2) return null;
  const first = dates[Math.max(0,dates.length-31)], last = dates[dates.length-1];
  const spanDays = (new Date(last)-new Date(first))/864e5;
  if(spanDays<1) return null;
  const delta = (S.days[last].hebeAge - S.days[first].hebeAge)/spanDays*30;
  // subtract natural chronological drift (~0.082/month) to show behavior-driven trend
  return Math.round((delta - 30/365.2425)*100)/100;
}

// ---------- levers + trajectory (the "so what") ----------
// Every lever's *best achievable* contribution is fixed by the same published
// coefficient that drives HEBE age (see ageAdjustments). So "reclaimable years"
// is not a motivational invention — it is the exact distance, in the model, from
// where you are to the floor the evidence supports. That is what we show.
// Floors: Sleep -0.10 (7h) · Training -2.2 · Strength -0.75 · Sitting 0 ·
//         Food -1.05 (~clean) · Resting HR -1.5 (~50bpm) · Stress 0.
const LEVER_FLOOR = { 'Sleep':-0.10, 'Training volume':-2.2, 'Strength':-0.75,
  'Sitting':0, 'Food quality':-1.05, 'Resting HR':-1.5, 'Stress':0 };
// Levers we can't move by tonight (RHR is a weeks-long adaptation) are still
// shown as trajectory, but never picked as "today's one move".
const LEVER_SLOW = { 'Resting HR':true };
function leverMove(name, st, m){
  switch(name){
    case 'Sleep': return st.sleepH < 7
      ? { move:'Get to 7 hours tonight', why:'you\'re averaging '+st.sleepH.toFixed(1)+'h — the sweet spot is 7' }
      : { move:'Cap sleep near 7 hours', why:'oversleeping ('+st.sleepH.toFixed(1)+'h avg) ages harder than short sleep in the data' };
    case 'Training volume': return { move:'Add ~'+Math.min(1.5,Math.max(0.3,(2.4-st.trainH))).toFixed(1)+'h of easy movement', why:'a longer ride or a zone-2 walk — you\'re at '+st.trainH.toFixed(1)+'h/day' };
    case 'Strength': { const need = st.liftPerWk<1.5?2:1; return { move:'Lift '+need+' more time'+(need>1?'s':'')+' this week', why:'resistance work 3×/wk is worth ~0.75y on its own; you\'re at '+st.liftPerWk.toFixed(1)+'/wk' }; }
    case 'Sitting': return { move:'Break up your sitting — stand every hour', why:'you\'re averaging '+st.sitH.toFixed(1)+'h/day seated' };
    case 'Food quality': return st.foodAvg==null
      ? { move:'Log a couple of meals', why:'food is a ~1-year lever you\'re not measuring yet — log to unlock it' }
      : { move:'Swap the most processed thing you eat', why:'your food score is '+Math.round(st.foodAvg)+'/100 — clean whole foods pull it up' };
    case 'Resting HR': return { move:'Bank zone-2 cardio this week', why:'resting HR ('+Math.round(st.rhrAvg)+'bpm) drops over a few weeks of easy cardio' };
    case 'Stress': return { move:'Take the edge off — walk, breathe, earlier wind-down', why:'stress is averaging '+st.stress.toFixed(1)+'/10' };
    default: return { move:'Hold the line', why:'' };
  }
}
// Returns levers sorted by reclaimable years (now → evidence-backed floor).
function levers(date){
  const st = windowStats(date, 21);
  if(!st) return [];
  const d = ensureDay(date), m = d.metrics;
  const parts = ageAdjustments(st).parts;
  return parts.map(([name, now])=>{
    const floor = LEVER_FLOOR[name] ?? 0;
    const gain = Math.max(0, now - floor);           // years currently left on the table
    const mv = leverMove(name, st, m);
    return { name, now, floor, gain, slow:!!LEVER_SLOW[name], move:mv.move, why:mv.why };
  }).sort((a,b)=> b.gain - a.gain);
}
// The single highest-leverage thing you can act on today.
function topLever(date){
  return levers(date).find(l => l.gain >= 0.12 && !l.slow) || null;
}
// Honest forward projection: a rate applied to habits. If today's habits become
// your normal, the offset holds; fixing your top lever improves it by exactly
// its reclaimable years — at the horizon and every year after.
function trajectory(date){
  const chrono = chronoAge(date);
  const st = windowStats(date, 21);
  if(!st) return null;
  const total = ageAdjustments(st).total;
  const lev = topLever(date);
  const H = 10;                                       // a decade out — relatable, honest
  const holdBio = chrono + H + total;
  const fixBio  = chrono + H + Math.max(-6, total - (lev? lev.gain : 0));
  return { horizonChrono: chrono + H, holdBio, fixBio, gain: lev? lev.gain : 0, lever: lev };
}

// ---------- evening debrief engine ----------
// Reuses the SAME published-HR coefficients as the HEBE-age model, but fed
// a single day's inputs, so the debrief is medically consistent with the age
// engine. Each ledger value is an age-equivalent (years) — read as "the effect
// if every day looked like today", which is exactly what the coefficient means.
function singleDayStat(date){
  const d = S.days[date]; if(!d) return null;
  const m = d.metrics;
  const food = (d.foods||[]).filter(f=>typeof f.score==='number').map(f=>f.score);
  const rhr = (d.heart&&d.heart.rhr) || (d.wearable&&d.wearable.restingHR) || null;
  return {
    n:1,
    sleepH:m.sleepH, sleepQ:m.sleepQ,
    trainH: m.rideH + (m.workoutMin||0)/60,
    liftPerWk: m.workoutDone ? 7 : 0,   // lifted today → full strength credit for the day
    sitH:m.sitH, stress:m.stress, mood:m.mood,
    foodAvg: food.length ? food.reduce((a,b)=>a+b,0)/food.length : null,
    rhrAvg: rhr
  };
}
const LEDGER_META = {
  'Sleep':           { good:'Slept near the 7h optimum',      bad:'Sleep off the 7h optimum',            fix:'Aim for ~7h — start winding down earlier tonight.' },
  'Training volume': { good:'Strong training load',           bad:'Low movement today',                  fix:'Add a ride or a brisk 30-min walk tomorrow.' },
  'Strength':        { good:'Resistance training banked',     bad:'No lifting today',                     fix:'Fit a lifting session in tomorrow.' },
  'Sitting':         { good:'Low sitting time',               bad:'Long sitting stretch',                 fix:'Break sitting every 30–60 min; stand/walk more.' },
  'Food quality':    { good:'Clean food quality',             bad:'Processed food pulled the day down',   fix:'Swap the flagged items for whole foods tomorrow.' },
  'Resting HR':      { good:'Athlete-low resting HR',         bad:'Resting HR above reference',           fix:'Prioritise sleep + zone-2; RHR follows recovery.' },
  'Stress':          { good:'Stress stayed low',              bad:'Stress ran high',                      fix:'A short wind-down / breathing block before bed.' }

// What actually moved today's ledger, in age-equivalent years, split good/bad.
function dayLedger(date){
  const st = singleDayStat(date);
  if(!st) return { helped:[], hurt:[], total:0, parts:[] };
  const { parts, total } = ageAdjustments(st);
  const helped=[], hurt=[];
  parts.forEach(([name,val])=>{
    const meta = LEDGER_META[name]||{good:name,bad:name,fix:''};
    if(val <= -0.03) helped.push({ name, val, label:meta.good });
    else if(val >= 0.03) hurt.push({ name, val, label:meta.bad, fix:meta.fix });
  });
  helped.sort((a,b)=>a.val-b.val);   // most youthening first (most negative)
  hurt.sort((a,b)=>b.val-a.val);     // most aging first
  return { helped, hurt, total, parts };
}
// Performance level vs published, age-referenced guidelines. Named bands only —
// the evidence doesn't support a fake single 0-100 number.
const PERF_BANDS = ['Below reference','On track','Strong','Elite'];
function bandColor(i){ return ['var(--coral)','var(--amber)','var(--teal)','var(--teal)'][i]; }
function performanceGrades(date){
  const d = S.days[date]; if(!d) return null;
  const m = d.metrics, age = chronoAge(date);
  // 7-day strength frequency (WHO: muscle-strengthening ≥2 days/week)
  const wk = confirmedDates(date).slice(-7);
  let lifts = wk.filter(k=>S.days[k].metrics.workoutDone).length;
  if(!wk.includes(date) && m.workoutDone) lifts++; // include today if unconfirmed
  const rhr = (d.heart&&d.heart.rhr) || (d.wearable&&d.wearable.restingHR) || null;

  const grade = (v,[a,b,c]) => v>=c?3 : v>=b?2 : v>=a?1 : 0; // ascending thresholds
  const rows = [];

  // AEROBIC — WHO 2020: 150–300 min/wk moderate OR 75–150 vigorous (1 vig=2 mod).
  // Daily moderate-equivalent target ≈ 21–43 min. Ride = zone-2 (moderate),
  // workout = vigorous (×2).
  const modEq = m.rideH*60 + (m.workoutDone ? (m.workoutMin||0)*2 : 0);
  rows.push({ name:'Aerobic activity', band:grade(modEq,[10,21,43]),
    note:Math.round(modEq)+' min mod-equiv today (WHO target 21–43/day)' });

  // STRENGTH — WHO: ≥2 days/week muscle-strengthening.
  rows.push({ name:'Strength', band:grade(lifts,[1,2,3]),
    note:lifts+'× in 7 days (WHO target ≥2/wk)' });

  // SLEEP — AASM/NSF: adults 7–9h; optimum ~7h (mortality U-curve). 65+: 7–8h.
  const so = Math.abs(m.sleepH-7);
  const sBand = so<=0.5?3 : (m.sleepH>=6.25&&m.sleepH<=8.5?2 : (m.sleepH>=5.5&&m.sleepH<=9?1:0));
  rows.push({ name:'Sleep', band:sBand, note:m.sleepH+'h (optimal ~7h, healthy 7–9h)' });

  // SITTING — sedentary ≥8h/day raises mortality; lower is better.
  const sitBand = m.sitH<6?3 : m.sitH<8?2 : m.sitH<10?1 : 0;
  rows.push({ name:'Sitting', band:sitBand, note:m.sitH+'h sitting (risk climbs past ~8h)' });

  // PROTEIN — vs your target (active adults ~1.2–1.6 g/kg; needs rise with age).
  const T = S.settings.proteinTarget||135;
  rows.push({ name:'Protein', band:grade(m.protein,[T*0.6,T*0.85,T]),
    note:m.protein+'g / '+T+'g target' });

  // RESTING HR — only when measured. Athlete-low is protective.
  if(rhr) rows.push({ name:'Resting HR', band:(rhr<55?3:rhr<65?2:rhr<75?1:0),
    note:rhr+' bpm (athlete <55, healthy <65)' });

  // Overall: weight the best-evidenced domains heaviest.
  const W = { 'Aerobic activity':3, 'Sleep':3, 'Strength':2, 'Resting HR':2, 'Sitting':1.5, 'Protein':1 };
  let num=0, den=0;
  rows.forEach(r=>{ const w=W[r.name]||1; num+=r.band*w; den+=w; });
  const overall = Math.round(num/den);
  return { rows, overall, age };
}
// One-line verdict: today's age-equivalent vs the 21-day baseline.
function debriefVerdict(date){
  const today = dayLedger(date).total;
  const base = ageAdjustments(windowStats(date,21)).total;
  const diff = today - base;                 // lower (more negative) = better day
  if(Math.abs(diff)<0.15) return { word:'held', dir:0, text:'Today held your recent line — steady is a win.' };
  if(diff<0) return { word:'a strong day', dir:-1, text:'Today ran younger than your 21-day average.' };
  return { word:'a soft day', dir:1, text:'Today ran a little older than your 21-day average.' };
}

// ---------- coach + insights (rule-based, AI-upgraded) ----------

async function coachAI(){

function insights(){
  const out = [];
  const dates = confirmedDates();
  // core vs arms sleep quality
  const core=[], arms=[];
  dates.forEach(k=>{ const d=S.days[k]; if(d.workoutType==='core') core.push(d.metrics.sleepQ); if(d.workoutType==='arms') arms.push(d.metrics.sleepQ); });
  if(core.length>=3 && arms.length>=3){
    const ca=core.reduce((a,b)=>a+b,0)/core.length, aa=arms.reduce((a,b)=>a+b,0)/arms.length;
    if(Math.abs(ca-aa)>=0.4) out.push('Sleep quality runs '+Math.round(Math.abs(ca-aa)/Math.max(aa,ca)*100)+'% higher on '+(ca>aa?'core':'arms')+' days than '+(ca>aa?'arms':'core')+' days.');
  }
  // protocol effect
  const p = S.protocols[0];
  if(p){
    const during = dates.filter(k=>k>=p.start&&k<=p.end&&activeProtocol(k));
    const after = during.map(k=>{ const n=new Date(k+'T12:00:00'); n.setDate(n.getDate()+1); return dstr(n); }).filter(k=>S.days[k]&&S.days[k].updatedAt>0);
    if(after.length>=2){
      const en = after.reduce((a,k)=>a+S.days[k].metrics.energy,0)/after.length;
      out.push('Post-fast days average energy '+en.toFixed(1)+'/10 — '+(en>=6.5?'the weekend fasts are not costing you Mondays.':'watch Monday energy; the fasts may be cutting into it.'));
    }
  }
  // sleep vs mood next day
  let pairs=[];
  dates.forEach(k=>{ const n=new Date(k+'T12:00:00'); n.setDate(n.getDate()+1); const nk=dstr(n);
    if(S.days[nk]&&S.days[nk].updatedAt>0) pairs.push([S.days[k].metrics.sleepH, S.days[nk].metrics.mood]); });
  if(pairs.length>=5){
    const lo = pairs.filter(p=>p[0]<7), hi = pairs.filter(p=>p[0]>=7);
    if(lo.length>=2&&hi.length>=2){
      const lm=lo.reduce((a,p)=>a+p[1],0)/lo.length, hm=hi.reduce((a,p)=>a+p[1],0)/hi.length;
      if(hm-lm>=0.5) out.push('Nights over 7h are followed by mood '+((hm-lm)).toFixed(1)+' points higher the next day.');
    }
  }
  if(!out.length) out.push(dates.length<7 ? 'Log '+(7-dates.length)+' more day'+(7-dates.length===1?'':'s')+' to unlock pattern detection.' : 'No strong new patterns this week — consistency itself is the pattern.');
  return out;
}

// ---------- Claude API ----------
async function claude(messages, system, maxTokens){
  const key = S.settings.apiKey;
  if(!key) throw new Error('No API key');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:S.settings.model||'claude-sonnet-5', max_tokens:maxTokens||500, system: system||undefined, messages })
  });
  if(!r.ok) throw new Error('API '+r.status);
  const j = await r.json();
  return textFromContent(j);
}
// Pull the first TEXT block. claude-sonnet-5 can return a leading
// "thinking" block, so content[0] is not always the answer.
function textFromContent(j){
  const blocks = (j&&j.content)||[];
  const t = blocks.find(b=>b&&b.type==='text'&&b.text);
  return t ? t.text : ((blocks[0]&&blocks[0].text)||'');
}
function extractJSON(txt){
  const m = String(txt).match(/\{[\s\S]*\}/);
  return m ? JSON.parse(m[0]) : null;
}

// DRI/RDA differ by sex and the gaps are not cosmetic - iron is 8 mg for men
// and 18 mg for menstruating women. Showing a woman male targets would render
// her iron green at half of what she needs. Sex is collected at onboarding;
// when it is unknown we take the higher of the two so nothing reads as "done"
// that might not be.
function userSex(){ const x=(S.settings&&S.settings.sex)||'na'; return (x==='male'||x==='female')?x:'na'; }
function cibleFor(n){
  const c=n.cible;
  if(typeof c==='number') return c;
  const sx=userSex();
  if(sx==='male') return c.m;
  if(sx==='female') return c.f;
  return Math.max(c.m,c.f);
}
