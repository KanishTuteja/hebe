function t(k){
  let s = (LANG[uiLang()]||LANG.en)[k];
  if(s===undefined) s = LANG.en[k];
  if(s===undefined) return k;
  for(let i=1;i<arguments.length;i++) s = s.split('{'+(i-1)+'}').join(arguments[i]);
  return s;
}
// Names carried by the data itself rather than the string table.
function nutName(n){ return uiLang()==='fr' ? (n.nomFr||n.nom) : n.nom; }
function nutRole(n){ return uiLang()==='fr' ? n.role : (n.roleEn||n.role); }
function nutSrc(n){  return uiLang()==='fr' ? n.src  : (n.srcEn||n.src); }
function foodName(a){ return uiLang()==='fr' ? a.nom : (a.en||a.nom); }
function foodNameOf(f){
  if(f.key && ALIMENTS[f.key]) return foodName(ALIMENTS[f.key]);
  return f.name || f.nomFr || '';
}
function langToggleHTML(){
  const l = uiLang();
  return '<div class="seg lang">'
    + '<button class="'+(l==='en'?'on':'')+'" data-lang="en">EN</button>'
    + '<button class="'+(l==='fr'?'on':'')+'" data-lang="fr">FR</button></div>';
}

// ---------- hand portions ----------
// The scale is what kills adherence. Hand portions cost nothing and land close
// enough to expose a structural gap (vitamin K at 16% is not a rounding error).
// Gram figures from Precision Nutrition's hand-size portion guide. Protein is
// converted from their cooked figure to a raw equivalent (+30%), because meat
// in this app is logged raw; vegetables, cooked grains/legumes and fats are
// logged as-served and need no conversion.
// Every portion entry is force-marked `est` - it is an approximation by
// construction, and hand size varies. It is never presented as measured.
const PORTIONS = {
  palm:   {icon:'✋', ofKey:'ofProtein', m:145, f:110},
  fist:   {icon:'✊', ofKey:'ofVeg',     m:100, f:100},
  cupped: {icon:'🤲', ofKey:'ofCarb',    m:160, f:125},
  thumb:  {icon:'👍', ofKey:'ofFat',     m:14,  f:14}
};
let portionMode = false;
let portionSel = {palm:0, fist:0, cupped:0, thumb:0};

function portionGrams(){
  const sx = userSex();
  return Object.keys(PORTIONS).reduce((sum,k)=>{
    const p = PORTIONS[k];
    // unknown sex: midpoint, so the estimate is not silently biased either way
    const g = sx==='male' ? p.m : sx==='female' ? p.f : (p.m+p.f)/2;
    return sum + g*portionSel[k];
  },0);
}
function portionsChosen(){ return Object.values(portionSel).some(v=>v>0); }
function resetPortions(){ portionSel = {palm:0, fist:0, cupped:0, thumb:0}; }
function portionSummary(){
  const parts = Object.keys(PORTIONS).filter(k=>portionSel[k]>0)
    // Plurals are looked up, never built by appending an s: French pluralises
    // the head noun ("mains en coupe"), not the phrase.
    .map(k=>portionSel[k]+' '+t(portionSel[k]>1 ? k+'_p' : k));
  return parts.join(' + ');
}

// The single gram figure the log uses, whichever way it was entered.
function currentGrams(){
  if(portionMode) return portionsChosen() ? Math.round(portionGrams()) : null;
  const el = document.getElementById('nQty');
  const v = el ? parseFloat(el.value) : NaN;
  return (isFinite(v) && v>0) ? v : null;
}
function currentEst(){
  if(portionMode) return true;              // a portion is an estimate, always
  const ee = document.getElementById('nEst');
  return ee ? ee.checked : false;
}

// ---------- nutrition maths ----------

// Open Food Facts gives reliable macros but patchy micronutrients, and its
// _100g unit conventions vary by field. Rather than risk a silent unit error
// that would poison a correlation, packaged foods contribute macros + fibre
// only; their micros stay null (= unknown, shown as unknown, never zero).
function nutrientsFromOFF(n){
  if(!n) return null;
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  const out = { kcal:num(n['energy-kcal_100g']), p:num(n.proteins_100g),
                g:num(n.carbohydrates_100g), l:num(n.fat_100g), fib:num(n.fiber_100g) };
  if(out.kcal===null && out.p===null && out.g===null && out.l===null) return null;
  return out;
}

// Totals over every food on the day that has BOTH a weight and nutrient data.
// Returns per-nutrient value plus how many weighed entries had no data for it,
// so "unknown" can be shown as unknown instead of quietly counting as zero.
function dayNutrition(date){
  const d = S.days[date];
  const t = {kcal:0,p:0,g:0,l:0};
  const inconnu = {}; const gramsWeighed = {grams:0, entries:0, estimated:0};
  NUTRIMENTS.forEach(n=>{ t[n.cle]=0; inconnu[n.cle]=0; });
  if(!d) return {t, inconnu, ...gramsWeighed, any:false};
  (d.foods||[]).forEach(f=>{
    if(!f.grams || !f.nutrients) return;
    const a = f.nutrients, fac = f.grams/100;
    gramsWeighed.grams += f.grams; gramsWeighed.entries++;
    if(f.est) gramsWeighed.estimated++;
    ['kcal','p','g','l'].forEach(k=>{ if(typeof a[k]==='number') t[k] += a[k]*fac; });
    NUTRIMENTS.forEach(n=>{
      const v = a[n.cle];
      if(typeof v === 'number') t[n.cle] += v*fac;
      else inconnu[n.cle]++;
    });
  });
  return {t, inconnu, grams:gramsWeighed.grams, entries:gramsWeighed.entries,
          estimated:gramsWeighed.estimated, any:gramsWeighed.entries>0};
}

// How many of the 22 hit their target today. This is the covariate surfaced on
// Home. It is DISPLAYED next to the HEBE age; it is never an input to it.
function nutritionCoverage(date){
  const {t, any} = dayNutrition(date);
  if(!any) return null;
  const hit = NUTRIMENTS.filter(n => t[n.cle]/cibleFor(n) >= 1).length;
  const short = NUTRIMENTS.map(n=>({n, pct:t[n.cle]/cibleFor(n)}))
                          .filter(x=>x.pct<0.7).sort((a,b)=>a.pct-b.pct);
  return {hit, total:NUTRIMENTS.length, short};
}

// Mifflin-St Jeor. Returns null unless weight, height and age all exist -
// no estimate stands in for a missing measurement.
// Mifflin–St Jeor: +5 for male, −161 for female. With sex unknown HEBE does not
// pick a term — it reports the range spanning both equations (the decision is the
// same across it), consistent with how zones are shown. Method error ~±10 %.
function bmrBounds(date){
  const d = S.days[date]; if(!d || !d.weightKg) return null;
  const h = S.settings.heightCm, a = chronoAge(date);
  if(!h || !a) return null;
  const base = 10*d.weightKg + 6.25*h - 5*a, sx = userSex();
  if(sx==='male')   return { lo: base+5,   hi: base+5,   known:true };
  if(sx==='female') return { lo: base-161, hi: base-161, known:true };
  return { lo: base-161, hi: base+5, known:false };
}
// Single number only when sex is known; null otherwise — use bmrBounds for display.
function bmrFor(date){
  const b = bmrBounds(date);
  return b && b.known ? b.lo : null;
}

// Weight trend across every day actually weighed.
function weightTrend(){
  const pts = Object.keys(S.days).filter(k=>S.days[k] && S.days[k].weightKg).sort();
  if(pts.length<2) return {n:pts.length, delta:null, days:null};
  const a=pts[0], b=pts[pts.length-1];
  return {n:pts.length,
          delta: Math.round((S.days[b].weightKg - S.days[a].weightKg)*10)/10,
          days: Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)};
}

// ---------- estimation layer ----------
// Published equations, personalised by the one cheap input a user can supply
// (resting HR), and honestly tiered. Nothing here feeds computeHebeAge.
//   E — Estimated: population equation only (widest range)
//   C — Calibrated: corrected by the user's own logged easy sessions
//   M — Measured:  a field test or a real supplied value
const TIER_LABEL = { E:'Estimated', C:'Calibrated', M:'Measured' };
function tierBadge(tier, text){
  const cls = tier==='M' ? 'purple' : tier==='C' ? 'teal' : 'gray';
  return '<span class="badge '+cls+' tierb">'+tier+(text?' · '+text:' · '+TIER_LABEL[tier])+'</span>';
}
// Tanaka, Monahan & Seals 2001: HRmax = 208 − 0.7·age, SD 7–11 bpm (healthy,
// non-medicated, non-smoking adults). Never displayed alone — input to zones only.
function hrMaxTanaka(date){
  const a = chronoAge(date||todayStr());
  return a>0 ? { bpm: 208 - 0.7*a, sd: 10, measured:false } : null;
}
function anchors(){ return (S.settings && S.settings.anchors) || {}; }
// Resting HR readings: every day with heart.rhr or wearable.restingHR inside the
// window, confirmed or not. Stored individually on the day; mean + spread used.
function rhrReadings(before, span){
  const end = before||todayStr(), lim = span||28, out = [];
  const endMs = new Date(end+'T12:00:00').getTime();
  Object.keys(S.days).sort().forEach(k=>{
    if(k>end) return;
    const d = S.days[k]; const r = (d.heart&&d.heart.rhr) || (d.wearable&&d.wearable.restingHR);
    if(!(r>0)) return;
    if((endMs - new Date(k+'T12:00:00').getTime())/864e5 <= lim) out.push({date:k, bpm:r});
  });
  return out;
}
function rhrStats(before, span){
  const rs = rhrReadings(before, span), n = rs.length;
  if(!n) return { n:0, mean:null, sd:null, min:null, max:null, readings:rs };
  const mean = rs.reduce((a,r)=>a+r.bpm,0)/n;
  const sd = n>1 ? Math.sqrt(rs.reduce((a,r)=>a+(r.bpm-mean)*(r.bpm-mean),0)/(n-1)) : null;
  return { n, mean, sd, min:Math.min.apply(null,rs.map(r=>r.bpm)), max:Math.max.apply(null,rs.map(r=>r.bpm)), readings:rs };
}
// ACSM intensity classification — Garber et al. 2011 (ACSM position stand,
// Med Sci Sports Exerc 43:1334–59), Table 5, as % of heart-rate reserve.
// ACSM does not number these bands, so neither does HEBE.
const ACSM_BANDS = [
  { key:'vlight', name:'Very light',   lo:0.00, hi:0.30, rpe:'RPE below 9', talk:'barely an effort' },
  { key:'light',  name:'Light',        lo:0.30, hi:0.40, rpe:'RPE 9–11',    talk:'easy — full conversation' },
  { key:'mod',    name:'Moderate',     lo:0.40, hi:0.60, rpe:'RPE 12–13',   talk:'can talk in sentences' },
  { key:'vig',    name:'Vigorous',     lo:0.60, hi:0.90, rpe:'RPE 14–17',   talk:'a few words at a time' },
  { key:'max',    name:'Near-maximal', lo:0.90, hi:1.00, rpe:'RPE 18+',     talk:'no talking' }
];
const ZONE_CALIB_K = 3;    // calibration weight n/(n+3); band shrink 3/(3+n)
const ZONE_ERR_FLOOR = 4;  // bpm — the band never claims tighter than this
// Calibration observations: easy sessions (talk-test "could chat") with a logged
// average HR. Only easy sessions calibrate — it is the one effort descriptor
// people report reliably. Harder sessions are stored but not used.
function calibObs(before){
  const end = before||todayStr(), out = [];
  Object.keys(S.days).sort().forEach(k=>{
    if(k>end) return; const h = S.days[k].heart;
    if(h && h.sessHR>0 && h.sessRPE==='easy') out.push({date:k, bpm:h.sessHR});
  });
  return out;
}
// Karvonen: target = HRrest + %HRR × (HRmax − HRrest). Error per band edge is
// propagated from the HRmax SD (scaled by the edge's %HRR) plus the resting-HR
// standard error, then shrunk by calibration, never below ZONE_ERR_FLOOR.
function zonesFor(date){
  date = date||todayStr();
  const rs = rhrStats(date, 28), an = anchors();
  const hm = (an.hrmax && an.hrmax.bpm>0) ? { bpm:+an.hrmax.bpm, sd:3, measured:true, date:an.hrmax.date, method:an.hrmax.method } : hrMaxTanaka(date);
  if(!hm) return { ok:false, reason:'nodob', rhr:rs };
  if(!rs.n) return { ok:false, reason:'norhr', rhr:rs };
  const sdR = rs.n>=3 ? Math.max(2, (rs.sd||2)/Math.sqrt(rs.n)) : 5;   // <3 readings: widened
  const obs = calibObs(date), n = obs.length;
  const hrr = hm.bpm - rs.mean;
  let offset = 0;
  if(n){ const mid = rs.mean + hrr*0.50; offset = obs.reduce((a,o)=>a+(o.bpm-mid),0)/n * n/(n+ZONE_CALIB_K); }
  const tier = hm.measured ? 'M' : (n>=3 ? 'C' : 'E');
  const bands = zoneBandsCore(hm, rs.mean, sdR, offset, n, hm.measured);
  return { ok:true, tier, hrmax:hm, rhr:rs, hrr, offset, nObs:n, bands,
           errMod: bands[2].err, nextErr: hm.measured ? ZONE_ERR_FLOOR : zoneErrAt(hm, sdR, 0.60, n+ZONE_CALIB_K), weak: rs.n<3 };
}
function zoneErrAt(hm, sdR, pct, k){ return Math.max(ZONE_ERR_FLOOR, Math.round((pct*hm.sd + (1-pct)*sdR) * ZONE_CALIB_K/(ZONE_CALIB_K+k))); }
// The band maths on its own, so onboarding can preview from two raw inputs and
// Performance shows the identical numbers once the reading is stored.
function zoneBandsCore(hm, rhrMean, sdR, offset, n, measured){
  const hrr = hm.bpm - rhrMean;
  const bands = ACSM_BANDS.map(b=>Object.assign({}, b, {
    loBpm: Math.round(rhrMean + hrr*b.lo + offset),
    hiBpm: Math.round(rhrMean + hrr*b.hi + offset),
    err: measured ? ZONE_ERR_FLOOR : zoneErrAt(hm, sdR, b.hi, n) }));
  // Bands abut, they do not overlap: 40–59 / 60–89, not 40–60 / 60–90.
  for(let i=0;i<bands.length-1;i++) bands[i].hiBpm = bands[i+1].loBpm - 1;
  return bands;
}
// Heart Rate Ratio Method — Uth, Sørensen, Overgaard & Pedersen 2004 (Eur J Appl
// Physiol 91:111–5), constant as corrected by the erratum (93:508–9): 15.0.
// Derived in well-trained, mostly male subjects: weaker for untrained and female
// users. Reported as a trend; the absolute is secondary and tier-labelled.
const VO2_K = 15.0;
function cooperVo2(metres){ return (metres - 504.9)/44.73; }   // Cooper 1968 12-min run
function vo2Est(before){
  before = before||todayStr(); const an = anchors();
  if(an.vo2max && an.vo2max.value>0) return { ok:true, tier:'M', value:+an.vo2max.value, date:an.vo2max.date, method:an.vo2max.method };
  const rs = rhrStats(before, 28), hm = hrMaxTanaka(before);
  if(!hm) return { ok:false, reason:'nodob', n:rs.n };
  if(rs.n<2) return { ok:false, reason:'norhr', n:rs.n };
  return { ok:true, tier:'E', value: VO2_K*hm.bpm/rs.mean, n:rs.n };
}
function estAddDays(k, n){ const d = new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return dstr(d); }
// Earliest 28-day window vs the latest one; needs ≥8 weeks of readings.
function vo2Trend(){
  const all = rhrReadings(todayStr(), 3650);
  if(all.length<4) return { ready:false, n:all.length, span:0 };
  const first = all[0].date, span = Math.round((new Date(todayStr()+'T12:00:00')-new Date(first+'T12:00:00'))/864e5);
  if(span<56) return { ready:false, n:all.length, span };
  const early = vo2Est(estAddDays(first,27)), late = vo2Est(todayStr());
  if(!early.ok||!late.ok||early.tier!=='E'||late.tier!=='E') return { ready:false, n:all.length, span };
  return { ready:true, span, from:early.value, to:late.value, pct:(late.value-early.value)/early.value*100, since:estAddDays(first,27) };
}
// Consistency: within-person dispersion of the user's own logs. No equation, no
// external data — the highest-confidence read in the app. Not part of HEBE age.
function consistencyRead(date){
  date = date||todayStr();
  const dates = confirmedDates(date).slice(-7);
  if(dates.length<4) return { ok:false, n:dates.length };
  const sl = dates.map(k=>+S.days[k].metrics.sleepH||0);
  const mean = sl.reduce((a,b)=>a+b,0)/sl.length;
  const sd = Math.sqrt(sl.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(sl.length-1));
  const tr = dates.map(k=>{ const m=S.days[k].metrics; return (+m.rideH||0)+(+m.workoutMin||0)/60; });
  let gap=0, cur=0; tr.forEach(v=>{ if(v>0.25) cur=0; else { cur++; gap=Math.max(gap,cur); } });
  return { ok:true, n:dates.length, sleepMean:mean, sleepSd:sd, sleepRange:Math.max.apply(null,sl)-Math.min.apply(null,sl),
           trainDays:tr.filter(v=>v>0.25).length, maxGap:gap };
}
const fmt1 = v => (Math.round(v*10)/10).toFixed(1);
// ---- estimation cards (Performance) ----
function zonesCardHTML(){
  const z = zonesFor(S.date);
  let h = '<div class="card mt fade"><div class="est-head"><h3>Training zones</h3>'+(z.ok?tierBadge(z.tier):'')+'</div>'
    + '<div class="sub">Heart-rate reserve (Karvonen) on ACSM’s intensity bands — Garber et al. 2011, Table 5. Max HR '+(z.ok&&z.hrmax.measured?'from your field test':'from Tanaka, 208 − 0.7 × age')+'.</div>';
  if(!z.ok){
    h += '<div class="sub mt">'+(z.reason==='nodob' ? 'Add your birth date in Setup and your bands appear here.'
      : 'Add a resting heart rate on <b>Body</b> — three mornings, before getting up — and your bands appear here.')+'</div></div>';
    return h;
  }
  h += '<div class="mt">';
  z.bands.forEach(b=>{
    h += '<div class="list-item zone-row"><span><b>'+b.name+'</b>'+(b.key==='mod'?' <span class="sub2">· usually called “zone 2”</span>':'')+'<div class="sub" style="font-size:11px">'+b.talk+' · '+b.rpe+'</div></span>'
      + '<b class="zone-range">'+b.loBpm+'–'+b.hiBpm+' bpm <span class="sub2">±'+b.err+'</span></b></div>';
  });
  h += '</div>';
  const r = z.rhr;
  h += '<div class="sub mt">Resting HR '+Math.round(r.mean)+' bpm · '+r.n+' reading'+(r.n>1?'s':'')+(r.n>1&&r.min!==r.max?' · spread '+r.min+'–'+r.max:'')+' · last 28 days.'
    + (z.weak ? ' <b>Log '+(3-r.n)+' more morning'+(3-r.n>1?'s':'')+'</b> and the resting-HR side settles.' : '')
    + (z.tier==='E' && !z.weak ? ' <b>Log 3 easy sessions with an average HR</b> on Body and the moderate band tightens to ±'+z.nextErr+'.' : '')
    + (z.tier==='C' ? ' Tuned to your last '+z.nObs+' easy sessions'+(z.nObs<6?' — '+(6-z.nObs)+' more tightens it to ±'+z.nextErr:'')+'.' : '')
    + (z.tier==='M' ? ' Max HR measured '+(z.hrmax.date||'')+' — the bands are yours, not the population’s.' : '')
    + '</div>';
  h += '<details class="reveal"><summary>What these mean<span class="sub2"> · and why vigorous is one band</span></summary>'
    + '<div class="sub" style="line-height:1.6">'
    + '<b>Moderate</b> is the conversational band most apps label “zone 2”: you can talk in sentences. HEBE keeps ACSM’s own names because ACSM does not number its bands, and inventing a numbering on top of a cited source would be dressing.<br>'
    + '<b>Vigorous</b> spans 60–89% of reserve because ACSM does not subdivide it — the health-outcome evidence does not support finer cuts, and a wider band you can trust beats a narrow one you cannot.<br>'
    + 'Tanaka’s max-HR equation carries a standard deviation of about 10 bpm and assumes a healthy, non-medicated, non-smoking adult. That is where most of the ± comes from. '
    + '<b>A $30 chest strap and a 20-minute field test beat this maths.</b> Enter a measured max HR under Anchor tests on Body and every band moves to Measured.'
    + '</div></details>';
  h += '</div>';
  return h;
}
function aerobicCardHTML(){
  const v = vo2Est(S.date), tr = vo2Trend();
  let h = '<div class="card mt fade"><div class="est-head"><h3>Aerobic capacity</h3>'+(v.ok?tierBadge(v.tier):'')+'</div>';
  if(!v.ok){
    h += '<div class="sub">'+(v.reason==='nodob' ? 'Add your birth date in Setup.' : 'Appears after two resting-HR readings on Body ('+v.n+' so far).')+'</div></div>';
    return h;
  }
  if(v.tier==='M'){
    h += '<div class="sub">Measured: <b>'+fmt1(v.value)+' ml/kg/min</b>'+(v.method?' · '+esc(v.method):'')+(v.date?' · '+v.date:'')+'.</div>';
  } else {
    if(tr.ready) h += '<div class="mt" style="font-size:14px">Your estimate has moved from <b>'+fmt1(tr.from)+'</b> to <b>'+fmt1(tr.to)+'</b> ml/kg/min ('+(tr.pct>0?'+':'')+fmt1(tr.pct)+'%) since '+tr.since+'.</div>';
    else h += '<div class="sub">The trend — the part worth reading — appears after 8 weeks of resting-HR readings ('+(tr.span?Math.round(tr.span/7)+' week'+(Math.round(tr.span/7)===1?'':'s'):'0 weeks')+' so far).</div>';
    h += '<div class="sub mt">Current estimate ≈ <b>'+Math.round(v.value)+' ml/kg/min</b> · estimated from age and resting HR · Heart Rate Ratio Method (Uth et al. 2004, constant 15.0 as corrected by the erratum).</div>';
    h += '<div class="sub mt"><b>Read the direction, not the number.</b> The method was derived in well-trained, mostly male subjects; the absolute is weaker if you are untrained or female. A free Cooper 12-minute run replaces it with a measurement — enter it under Anchor tests on Body.</div>';
  }
  h += '</div>';
  return h;
}
function consistencyCardHTML(){
  const c = consistencyRead(S.date);
  let h = '<div class="card mt fade"><div class="est-head"><h3>Consistency</h3><span class="badge gray tierb">your own logs · no estimate</span></div>';
  if(!c.ok){ h += '<div class="sub">Appears after four logged nights ('+c.n+' so far).</div></div>'; return h; }
  const sdTxt = fmt1(c.sleepSd);
  h += '<div class="mt" style="font-size:14px">Sleep varied <b>±'+sdTxt+' h</b> night to night over the last '+c.n+' nights (range '+fmt1(c.sleepRange)+' h).</div>';
  h += '<div class="sub mt">'+(c.sleepSd>1.0 ? 'Steadying that is worth more than adding an hour.' : c.sleepSd<=0.5 ? 'Steady. That is the part most people never get.' : 'Fairly steady — hold it.')
    + ' Training on '+c.trainDays+' of '+c.n+' days'+(c.maxGap>=3?', longest gap '+c.maxGap+' days.':'.')+'</div>';
  h += '<div class="sub mt">Not part of your HEBE age — a read of your own regularity, straight from what you logged.</div>';
  h += '</div>';
  return h;
}
// ---- Body: readings line, session row, anchor tests ----
function rhrLineHTML(){
  const r = rhrStats(S.date, 28);
  if(!r.n) return '<div class="sub mt" style="font-size:11px">No readings in the last 28 days. Take it on waking, before getting up — three mornings is enough to start.</div>';
  return '<div class="sub mt" style="font-size:11px">'+r.n+' reading'+(r.n>1?'s':'')+' in 28 days · mean '+Math.round(r.mean)+' bpm'+(r.n>1&&r.min!==r.max?' · spread '+r.min+'–'+r.max:'')+(r.n<3?' · '+(3-r.n)+' more and your zones settle':'')+'</div>';
}
function sessionRowHTML(d){
  const rpe = d.heart && d.heart.sessRPE || '';

// ============================================================================
//  LOCAL INTELLIGENCE  —  full scoring with no API key
//
//  The no-key path is not a degraded fallback. Food quality does not need a
//  language model: NOVA is a classification with published criteria, and
//  Nutri-Score is arithmetic (FSA-NPS, 2023 revision). Both are reproducible,
//  auditable and run offline - which for a health number is BETTER than an
//  LLM, because the same food always returns the same score and the reasoning
//  can be shown rather than trusted.
//
//  An API key upgrades the wording and handles genuinely ambiguous cases
//  (mixed dishes, unlisted ingredients). It is an option, never a requirement.
//
//  Honest limit: every input here must be real. A missing nutrient returns
//  null and lowers the stated confidence - it is never defaulted to zero,
//  because a zero is a claim.
// ============================================================================

// FSA-NPS 2023, general foods.
function stepPts(v, step, max){ if(v==null) return null; let p=0; while(p<max && v > step*(p+1)) p++; return p; }
function tablePts(v, arr){ if(v==null) return null; let p=0; arr.forEach(th=>{ if(v>th) p++; }); return p; }

const NPS_FIBRE   = [3.0,4.1,5.2,6.3,7.4];
const NPS_PROTEIN = [2.4,4.8,7.2,9.6,12,14,17];

function fsaNps(n){
  if(!n) return null;
  const kj = n.kj!=null ? n.kj : (n.kcal!=null ? n.kcal*4.184 : null);
  const parts = { energy:stepPts(kj,335,10), sugars:stepPts(n.sugars,3.4,15),
                  satfat:stepPts(n.satfat,1,10), salt:stepPts(n.salt,0.2,20) };
  // Never guess a missing negative input - without it there is no score.
  if(Object.values(parts).some(x=>x==null)) return null;
  const N = parts.energy+parts.sugars+parts.satfat+parts.salt;
  const fib = tablePts(n.fibre, NPS_FIBRE) ?? 0;
  const pro = tablePts(n.protein, NPS_PROTEIN) ?? 0;
  // Fruit/veg/legume share is rarely published. Absent, it counts 0, which is
  // the conservative direction: a produce-heavy product scores no better than
  // its nutrients justify, rather than better than the evidence supports.
  const fvl = n.fvl!=null ? (n.fvl>80?5:n.fvl>60?2:n.fvl>40?1:0) : 0;
  const P = fvl + fib + (N < 11 ? pro : 0);
  const sc = N - P;
  return { score:sc, grade: sc<1?'a':sc<3?'b':sc<11?'c':sc<19?'d':'e',
           N, P, fvlKnown:n.fvl!=null, proteinCounted: N<11 };
}

// Markers of industrial formulation - the substances that only appear in a
// factory. Their presence is what separates NOVA 4 from NOVA 3.
const UPF_MARKERS = [
  /high[- ]fructose|glucose[- ]fructose|invert sugar|corn syrup|dextrose|maltodextrin/i,
  /hydrogenated|interesterified/i,
  /protein (isolate|concentrate)|hydroly[sz]ed/i,
  /modified (corn |potato |tapioca )?starch/i,
  /flavou?r(ing)?\b/i,
  /colou?r(ing)?\b|caramel colou?r|titanium dioxide|tartrazine|allura/i,
  /emulsifier|stabili[sz]er|thickener|anti[- ]caking|humectant|firming agent/i,
  /carrageenan|xanthan|guar gum|polysorbate|mono-? and diglycerides|lecithin/i,
  /aspartame|sucralose|acesulfame|saccharin|sweetener/i,
  /sodium nitrite|sodium nitrate|benzoate|sorbate|\bbha\b|\bbht\b|tbhq/i,
  /\bE\d{3}\b/
];
// Culinary ingredients - NOVA 2 alone, NOVA 3 when added to a whole food.
const CULINARY = /\b(sugar|salt|oil|butter|honey|syrup|vinegar|starch|lard|tallow|ghee)\b/i;

// NOVA from the ingredient list, following the published criteria: count the
// ingredients, then look for what only industry adds.
function novaFromIngredients(txt){
  if(!txt || !txt.trim()) return null;
  const clean = txt.replace(/\([^)]*\)/g,' ');
  const items = clean.split(/[,;]+/).map(x=>x.trim()).filter(x=>x.length>1);
  const hits = UPF_MARKERS.filter(rx=>rx.test(txt)).length;
  if(hits >= 2) return {nova:4, why:'multiple industrial formulation markers'};
  if(hits === 1) return {nova:4, why:'an industrial formulation marker'};
  if(items.length === 1) return {nova:1, why:'a single whole ingredient'};
  if(items.length <= 3 && CULINARY.test(txt)) return {nova:3, why:'a whole food with added salt, sugar or oil'};
  if(items.length <= 2) return {nova:1, why:'one or two whole ingredients'};
  return {nova:3, why:'several ingredients, none of them industrial markers'};
}

// Pull the FSA-NPS inputs out of an Open Food Facts product, in its units.
function nutrForNps(product){
  const n = product && product.nutriments; if(!n) return null;
  const num = v => (typeof v==='number' && isFinite(v)) ? v : null;
  let salt = num(n.salt_100g);
  if(salt==null && num(n.sodium_100g)!=null) salt = n.sodium_100g*2.5;
  return { kj:num(n['energy-kj_100g']), kcal:num(n['energy-kcal_100g']),
           sugars:num(n.sugars_100g), satfat:num(n['saturated-fat_100g']),
           salt:salt, fibre:num(n.fiber_100g), protein:num(n.proteins_100g),
           fvl:num(n['fruits-vegetables-legumes-estimate-from-ingredients_100g'])
               ?? num(n['fruits-vegetables-nuts-estimate-from-ingredients_100g']) };
}

// The 0-100 longevity score. NOVA sets the band, Nutri-Score moves within it,
// flagged ingredients subtract. Same anchoring the AI prompt uses, so a user
// with a key and one without are reading the same scale.
const NOVA_BAND = {1:[85,98], 2:[70,84], 3:[50,69], 4:[15,49]};

function localScore(name, ingredients, product){
  const flagged = [];
  const text = (ingredients||'') + ' ' + (name||'');
  JUNK.forEach(j=>{ if(j.rx.test(text) && !flagged.some(f=>f.ingredient===j.name))
    flagged.push({ingredient:j.name, reason:j.why}); });

  const nps = fsaNps(nutrForNps(product));
  const offGrade = product && product.nutriscore_grade;
  const grade = offGrade || (nps ? nps.grade : null);

  const offNova = product && Number(product.nova_group);
  const derived = novaFromIngredients(ingredients);
  const nova = (offNova>=1 && offNova<=4) ? offNova : (derived ? derived.nova : null);

  const band = NOVA_BAND[nova] || [45,75];
  let score = (band[0]+band[1])/2;
  if(grade) score += ({a:6,b:3,c:0,d:-4,e:-8})[grade] || 0;
  score -= Math.min(12, flagged.length*3);
  score = clamp(Math.round(score), band[0]-6, band[1]);

  // Confidence follows the evidence actually used, nothing more.
  let confidence = 'low';
  if((offGrade || nps) && (offNova || derived)) confidence = 'high';
  else if(offGrade || nps || offNova || derived) confidence = 'med';

  const bits = [];
  if(nova) bits.push('NOVA'+nova + (offNova ? '' : derived ? ' ('+derived.why+')' : ''));
  if(offGrade) bits.push('Nutri-Score '+offGrade.toUpperCase());
  else if(nps) bits.push('Nutri-Score '+nps.grade.toUpperCase()+' computed here ('+nps.N+' minus '+nps.P+')');
  if(!bits.length) bits.push('name only — no ingredients or nutrition found');

  const summary = flagged.length
    ? flagged.length+' flagged ingredient'+(flagged.length>1?'s':'')+'.'
    : (nova===1||nova===2) ? 'Whole or minimally processed.' : 'No flagged ingredients found.';

  return { score, flagged, summary, nova: nova||null, confidence,
           basis: bits.join(' · '), src:'local' };
}

// Kept as the old name so every existing call site keeps working.
function heuristicScore(name, ingredients, product){ return localScore(name, ingredients, product); }

async function scoreFood(name, ingredients, product){
  if(!S.settings.apiKey) return heuristicScore(name, ingredients, product);
  try{
    const nutr = product&&product.nutriments ? JSON.stringify({kcal:product.nutriments['energy-kcal_100g'],sugar:product.nutriments.sugars_100g,protein:product.nutriments.proteins_100g,satfat:product.nutriments['saturated-fat_100g']}) : 'unknown';
    const txt = await claude([{role:'user',content:'Score this food 0-100 for ingredient quality relative to longevity/all-cause-mortality evidence.\nGround the score in established frameworks, in this order:\n1) NOVA processing class (1=unprocessed → 4=ultra-processed; UPF carries HR~1.15-1.21 for all-cause mortality, dose-response meta-analyses).\n2) Nutri-Score / nutrient profile (sat fat, added sugar, sodium, fibre, protein) from the /100g nutrition when present.\n3) Specific evidence-flagged ingredients (industrial seed oils, added/free sugars, sweeteners, "natural flavors", nitrites/nitrates, emulsifiers, dyes).\nAnchoring: NOVA1 whole food ~85-98, NOVA2 ~70-84, NOVA3 ~50-69, NOVA4 ultra-processed ~15-49.\nReport how confident you are: "high" = ingredients listed or a branded product with nutrition data; "med" = generic whole food judged from name; "low" = ambiguous/mixed dish estimated from name alone.\nState the single most important basis in one short phrase.\nFood: '+name+'\nIngredients: '+(ingredients||'NOT LISTED - infer NOVA class and nutrients from the name, lower your confidence')+'\nNutrition/100g: '+nutr+'\nONLY valid JSON: {"score":<int>,"nova":<1-4 or null>,"confidence":"high|med|low","basis":"<short phrase, e.g. NOVA4 ultra-processed + added sugar>","flagged":[{"ingredient":"...","reason":"..."}],"summary":"<one line>"}'}], 'You are a nutrition scientist scoring foods for longevity using NOVA classification, Nutri-Score nutrient profiling, and all-cause-mortality evidence for ultra-processed foods. Score on the evidence; never inflate certainty. When ingredients are unknown you MUST lower your confidence rather than guess precisely.', 700);
    const p = extractJSON(txt);
    return { score:clamp(Math.round(p.score),0,100), flagged:p.flagged||[], summary:p.summary||'', nova:(p.nova!=null?Number(p.nova):null), confidence:p.confidence||'med', basis:p.basis||'', src:'ai' };
  }catch(e){ console.warn(e); toast('AI scoring failed — used built-in scorer'); return heuristicScore(name, ingredients, product); }
}

function repeatOffenders(rangeDays){
  const counts={}; const cutoff = rangeDays? Date.now()-rangeDays*864e5 : 0;
  Object.values(S.days).forEach(d=> (d.foods||[]).forEach(f=>{
    if(cutoff && (f.ts||0)<cutoff) return;

async function applyCheckin(asPlanned){
  const d = ensureDay(S.date);
  if(!asPlanned){

          const p = extractJSON(out);
          if(p&&p.note&&p.confidence) p.note += ' ['+p.confidence+' confidence]';
          if(p&&p.changes) Object.entries(p.changes).forEach(([k,v])=>{
            if(!METRIC_FIELDS.includes(k)) return;
            if(k==='workoutDone'||k==='supplements'){ d.metrics[k]=!!v; }
            else { const n=Number(v); if(!isNaN(n)) d.metrics[k]=n; }
          });
          if(p&&p.note) d.notes = (d.notes?d.notes+' · ':'')+p.note;
          toast('Day updated from your note');
        }catch(e){ console.warn(e); d.notes=(d.notes?d.notes+' · ':'')+text; toast('Saved as note (AI parse failed)'); }
      } else d.notes=(d.notes?d.notes+' · ':'')+text;
    }
  }
  const wt = document.querySelector('.wt-chip.on');
  if(wt && d.template==='weekday'){ d.workoutType = wt.dataset.wt; S.lastWorkoutType = wt.dataset.wt; }
  const wasPast = S.date < todayStr();
  // Score reveal. Pure reads either side of the write - nothing here touches the
  // day doc. Skipped on a backfill, which lands on a different date anyway.
  const scBefore = (!wasPast && scoreReady()) ? scoreAt(S.date) : null;
  d.confirmed = true;
  if(wasPast) d.backfilled = true;
  saveDay(S.date);
  const scAfter = (!wasPast && scoreReady()) ? scoreAt(S.date) : null;
  scoreReveal = (scBefore && scAfter && scBefore.score!=null && scAfter.score!=null)
    ? { from: scBefore.score, to: scAfter.score, lever: scoreTopMover(scBefore.parts, scAfter.parts) }
    : null;
  checkinOpen=false; activeChips.clear();
  if(wasPast){
    // Catching up: walk straight to the next missed day, then land back on today.
    const next = missedDates()[0];
    goToDate(next || todayStr());
    toast(next ? fmtDate(d.date)+' logged — next: '+shortDate(next) : 'Caught up — all days logged');
    return;
  }
  render();
  toast('Day logged — HEBE age updated');
}

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
const crosshair = {
  id:'crosshair',
  afterDraw(chart){

    if(!act||!act.length) return;
    const x = act[0].element.x, {top,bottom} = chart.chartArea, ctx = chart.ctx;
    ctx.save(); ctx.strokeStyle = css('--line2'); ctx.setLineDash([3,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bottom); ctx.stroke(); ctx.restore();

function protocolBandPlugin(dates){
  return { id:'protoBands', beforeDatasetsDraw(chart){
    const xs = chart.scales.x; if(!xs) return;
    const ctx = chart.ctx, area = chart.chartArea;
    ctx.save(); ctx.fillStyle = css('--amber-bg');
    let run = null;
    dates.forEach((dt,i)=>{
      const on = !!activeProtocol(dt);
      if(on && run===null) run = i;
      if((!on||i===dates.length-1) && run!==null){
        const endI = on? i : i-1;
        const x1 = xs.getPixelForValue(run)- (xs.getPixelForValue(1)-xs.getPixelForValue(0))/2;
        const x2 = xs.getPixelForValue(endI)+ (xs.getPixelForValue(1)-xs.getPixelForValue(0))/2;
        ctx.globalAlpha = .5; ctx.fillRect(x1, area.top, x2-x1, area.bottom-area.top); ctx.globalAlpha=1;
        run=null;
      }
    });
    ctx.restore();
  }};
}
function baseOpts(yMin,yMax){

  return { responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},

    scales:{ x:{grid:{color:css('--line')},ticks:{...tick}}, y:{min:yMin,max:yMax,grid:{color:css('--line')},ticks:{...tick}} } };

function destroyCharts(){ Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={}; }
function rangeDates(n){
  const out=[]; const now=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); out.push(dstr(d)); }

}
function rolling(arr, w){
  return arr.map((v,i)=>{
    const win = arr.slice(Math.max(0,i-w+1), i+1).filter(x=>x!=null);
    return win.length? win.reduce((a,b)=>a+b,0)/win.length : null;
  });
}
function dayStory(date){
  const d = S.days[date];

// ---------- firebase ----------
function parseFbConfig(){
  const raw=(S.settings.fbConfig||'').trim(); if(!raw) return null;
  try{
    const jsonish = raw.replace(/^[^{]*\{/s,'{').replace(/\}[^}]*$/s,'}').replace(/([,{]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*\}/g,'}');
    return JSON.parse(jsonish);
  }catch(e){ return null; }
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function initFirebase(){
  const cfg = parseFbConfig(); if(!cfg||S.fb.app) return;
  setSync('syncing');
  try{
    const v='10.14.1';
    await loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-auth-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/'+v+'/firebase-firestore-compat.js');
    S.fb.app = firebase.initializeApp(cfg);
    S.fb.db = firebase.firestore();
    firebase.auth().onAuthStateChanged(async u=>{
      S.fb.user=u;
      if(u){ await pullCloud(); setSync('synced'); } else setSync('local');
      if(S.page==='setup') render();
    });
  }catch(e){ console.warn(e); setSync('error'); toast('Firebase init failed — check config'); }
}
async function signInGoogle(){
  if(!S.fb.app) await initFirebase();
  if(!S.fb.app){ toast('Paste a valid Firebase config first'); return; }
  try{ await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e){ toast('Sign-in failed: '+e.message); }
}
async function pullCloud(){
  if(!S.fb.user) return;
  const col = S.fb.db.collection('users').doc(S.fb.user.uid);
  const snap = await col.collection('days').get();
  let pulled=0;
  snap.forEach(doc=>{ const r=doc.data(), l=S.days[doc.id];
    // newer confirmed write wins; on a tie, a newer side-feature write (touchedAt) wins
    if(!l||(r.updatedAt||0)>(l.updatedAt||0)||((r.updatedAt||0)===(l.updatedAt||0)&&(r.touchedAt||0)>(l.touchedAt||0))){ S.days[doc.id]=r; pulled++; } });
  const meta = await col.get();
  if(meta.exists){ const md=meta.data();
    if(md.templates && (!localStorage.getItem('hebe_templates'))) S.templates=md.templates;
    if(md.protocols && (!localStorage.getItem('hebe_protocols'))) S.protocols=md.protocols;
    if(md.meals && !Object.keys(S.meals||{}).length) S.meals = md.meals;
    if(md.plan && !Object.keys(planWeeks()).length) S.plan = Object.assign(S.plan||{}, md.plan);
    // pull synced settings (API key, model, targets, dob, name) — never overwrite
    // this device's own Firebase config
    if(md.settings){ const s=md.settings; delete s.fbConfig;
      ['apiKey','model','proteinTarget','dob','name','anchors'].forEach(k=>{ if(s[k]!=null && !S.settings[k]) S.settings[k]=s[k]; });
      if(s.apiKey) S.settings.apiKey = s.apiKey;
    }
  }
  Object.keys(S.days).forEach(k=>{ if(S.days[k].updatedAt>0) cloudPush(k); });
  // Always persist + re-render: settings (API key, model, targets, dob, name)
  // may have been pulled even when no new day docs arrived. Without this the
  // synced key lived only in memory and was lost on reload → re-asked per device.
  persist(); render();
}
const pushQ=new Set(); let pushT=null, metaT=null;
// Push settings/templates/protocols only (no day docs). Called whenever a
// setting changes so the API key + prefs reach Firestore immediately, not just
// when a day happens to be logged. Uses its own debounce timer.
function pushSettings(){
  if(!S.fb.user||!S.fb.db) return;
  clearTimeout(metaT); setSync('syncing');
  metaT=setTimeout(async()=>{
    try{
      const col=S.fb.db.collection('users').doc(S.fb.user.uid);
      const syncSettings=Object.assign({},S.settings); delete syncSettings.fbConfig;
      await col.set({templates:S.templates, protocols:S.protocols, settings:syncSettings,
                     meals:S.meals||{}, plan:S.plan||{}},{merge:true});
      setSync('synced');
    }catch(e){ console.warn(e); setSync('error'); }
  },800);
}
function cloudPush(date){
  if(!S.fb.user||!S.fb.db) return;
  pushQ.add(date); clearTimeout(pushT); setSync('syncing');
  pushT=setTimeout(async()=>{
    try{
      const col=S.fb.db.collection('users').doc(S.fb.user.uid);
      for(const dt of pushQ) await col.collection('days').doc(dt).set(S.days[dt],{merge:true});
      // sync settings too (so API key + prefs follow you to every device),
      // minus fbConfig which is device-local by design
      const syncSettings = Object.assign({}, S.settings); delete syncSettings.fbConfig;
      await col.set({templates:S.templates, protocols:S.protocols, settings:syncSettings,
                     meals:S.meals||{}, plan:S.plan||{}},{merge:true});
      pushQ.clear(); setSync('synced');
    }catch(e){ console.warn(e); setSync('error'); }
  },900);
}

  S.fb.status=s;
  const map={local:['var(--text3)','Local only'],syncing:['var(--amber)','Syncing…'],synced:['var(--teal)','Synced'],error:['var(--coral)','Sync error']};
  const d=document.getElementById('syncDot'), l=document.getElementById('syncLbl');
  if(d){ d.style.background=map[s][0]; } if(l){ l.textContent=map[s][1]; }
}

// Evening debrief block — grows the coach card after ~5pm.
function debriefHTML(date){
  const led = dayLedger(date);
  const perf = performanceGrades(date);
  const verdict = debriefVerdict(date);
  if(!perf) return '';
  const yrs = v => (Math.abs(v)<0.05?'<0.1':Math.abs(v).toFixed(1))+'y';
  const dayLbl = (date===todayStr()) ? "Today's factors" : fmtDate(date)+' factors';
  let h = '<div class="fade" style="padding-top:4px">';
  h += '<div style="font-weight:700;font-size:13px;margin-bottom:9px">'+dayLbl+'</div>';

  // Performance level headline (age-referenced, named band)
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">'
    + '<div><div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Performance level · age '+perf.age.toFixed(0)+'</div>'
    + '<div style="font-size:19px;font-weight:700;color:'+bandColor(perf.overall)+';margin-top:1px">'+PERF_BANDS[perf.overall]+'</div></div>'
    + '<div class="badge '+(verdict.dir<=0?'teal':'coral')+'">'+(verdict.dir<0?ICONS.down:verdict.dir>0?ICONS.up:'')+' '+verdict.word+'</div></div>';
  h += '<div class="sub" style="margin-top:5px;line-height:1.5">'+esc(verdict.text)+' Graded against WHO activity, AASM sleep and resting-HR norms for your age.</div>';

  // Domain grades
  h += '<div style="margin-top:11px;display:flex;flex-direction:column;gap:5px">';
  perf.rows.forEach(r=>{
    h += '<div style="display:flex;align-items:center;gap:9px">'
      + '<span style="width:7px;height:7px;border-radius:50%;background:'+bandColor(r.band)+';flex-shrink:0"></span>'
      + '<span style="font-size:12.5px;font-weight:600;min-width:112px">'+r.name+'</span>'
      + '<span style="font-size:11.5px;color:'+bandColor(r.band)+';font-weight:600;min-width:96px">'+PERF_BANDS[r.band]+'</span>'
      + '<span class="sub" style="font-size:11px">'+esc(r.note)+'</span></div>';
  });
  h += '</div>';

  // What helped / hurt today (age-equivalent ledger)
  h += '<div style="margin-top:13px"><div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">If every day looked like today</div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px">';
  h += '<div><div style="font-size:11.5px;font-weight:700;color:var(--teal);margin-bottom:4px">Helped ↓ age</div>'
     + (led.helped.length ? led.helped.map(x=>'<div style="font-size:12px;line-height:1.5">'+esc(x.label)+' <span class="sub">−'+yrs(x.val)+'</span></div>').join('') : '<div class="sub" style="font-size:12px">—</div>')
     + '</div>';
  h += '<div><div style="font-size:11.5px;font-weight:700;color:var(--coral);margin-bottom:4px">Hurt ↑ age</div>'
     + (led.hurt.length ? led.hurt.map(x=>'<div style="font-size:12px;line-height:1.5">'+esc(x.label)+' <span class="sub">+'+yrs(x.val)+'</span></div>').join('') : '<div class="sub" style="font-size:12px">—</div>')
     + '</div>';
  h += '</div></div>';

  // Carries into tomorrow — the SAME action spine as oneMoveHTML, never a second
  // directive. The ledger above is a single day; the one move is the 21-day rolling
  // pattern. When the two disagree it is only because of that, so name the window
  // rather than printing two contradictory instructions 250px apart.
  const topFix = led.hurt[0];
  const carryLev = topLever(date);
  let carryHTML;
  if(topFix) carryHTML = esc(topFix.fix);
  else if(carryLev) carryHTML = 'Nothing dragged today. Your one move — <b>'+esc(carryLev.move.toLowerCase())+'</b> — is about your 21-day pattern, not this day.';
  else carryHTML = 'Nothing dragged today — protect your sleep and repeat it.';
  h += '<div class="carry"><span class="lab">Carries into tomorrow</span><span class="b">'+carryHTML+'</span></div>';

  h += '<div class="sub" style="font-size:10.5px;margin-top:9px;line-height:1.4">Estimate from your logged day, not a diagnosis. Years shown are age-equivalent effects of sustaining today’s pattern.</div>';
  h += '</div>';
  return h;
}

function homeCharts(){
  if(typeof Chart==='undefined') return;
  const n = 30;
  const dates = rangeDates(n);
  const chrono0 = chronoAge(dates[0]);
  const data = dates.map(dt=>{ const d=S.days[dt]; return d&&d.updatedAt>0&&d.hebeAge!=null? d.hebeAge : null; });
  const ctx = document.getElementById('chAgeSpark'); if(!ctx) return;
  const opts = baseOpts(undefined, undefined);
  opts.scales.y.ticks.callback = v=>v.toFixed(1);
  opts.scales.x.ticks.maxTicksLimit=6;
  charts.spark = new Chart(ctx,{ type:'line',
    data:{ labels:dates.map(x=>x.slice(5)), datasets:[
      { data:data, borderColor:css('--teal'), backgroundColor:'transparent', tension:.35, spanGaps:true, pointRadius:2, pointHoverRadius:5, borderWidth:2 },
      { data:dates.map((dt,i)=>chrono0+i/365.2425), borderColor:css('--line2'), borderDash:[4,4], pointRadius:0, borderWidth:1 } ] },
    options:opts, plugins:[crosshair, protocolBandPlugin(dates)] });
  attachStory(charts.spark, dates);
  // count-up animation on the hero number
  const el = document.getElementById('ageNum');
  if(el && !el._animated){ el._animated=true;
    const target = parseFloat(el.textContent), start = target + 0.6; let t0=null;
    // the "yrs younger / older" sub-line follows the same animated value, so the
    // two never disagree mid-count (it lands on the first check-in, the most-watched second)
    const dl = document.getElementById('ageDelta'), chrono = dl ? parseFloat(dl.dataset.chrono) : NaN;
    const sub = v => { if(!dl || !isFinite(chrono)) return; dl.textContent = ageDeltaText(v, chrono); };
    const step = ts=>{ if(!t0) t0=ts; const p=Math.min(1,(ts-t0)/1200), e2=1-Math.pow(1-p,3);
      const v = start+(target-start)*e2; el.textContent=v.toFixed(2); sub(v); if(p<1) requestAnimationFrame(step); };
    sub(start);
    requestAnimationFrame(step);
  }
  // The score hero uses the same count-up. After a check-in it starts from
  // yesterday's value rather than the generic offset, so the number visibly
  // answers the day that was just logged (HEBE_SCORE_V2.md §2.4).
  const sEl = document.getElementById('scoreHero');
  if(sEl && !sEl._animated){ sEl._animated=true;
    const target = parseFloat(sEl.textContent);
    const start = (scoreReveal && isFinite(scoreReveal.from)) ? scoreReveal.from : Math.max(0, target-6);
    let s0=null;
    const sstep = ts=>{ if(!s0) s0=ts; const p=Math.min(1,(ts-s0)/1200), e=1-Math.pow(1-p,3);
      sEl.textContent = (start+(target-start)*e).toFixed(1); if(p<1) requestAnimationFrame(sstep); };
    sEl.textContent = start.toFixed(1);
    requestAnimationFrame(sstep);
  }
  scoreReveal = null;   // consumed once; never replays on a plain re-render
}

/* =======================================================================
   THE HEBE SCORE (0–100)
   -----------------------------------------------------------------------
   Spec: HEBE_SCORE_BUILD.md · HEBE_MASTER_PLAN.md §5.8.

   score = 50 − (adjustment × 8.33)      −6 → 100 · 0 → 50 · +6 → 0

   It invents nothing. It is a linear rescale of the bounded adjustment
   `ageAdjustments` already returns every day, so it needs no new data, no
   backend, no history and no ML.

   WHY IT EXISTS ALONGSIDE HEBE AGE, NOT INSTEAD OF IT.
   HEBE age is chronological age + adjustment, so a 45-year-old with immaculate
   habits reads 39 and a 25-year-old wrecking himself reads 30. Comparing those
   compares *age*, not effort. The adjustment is the age-independent quantity —
   already bounded, already built from published coefficients. The age stays the
   anchored honest metric on Home; the score is the comparable one.

   100 means every lever sits at its evidence-backed floor. Not an arbitrary
   ceiling — the floors come from the same coefficients as the age.

   PRIVATE. Sharing, circles, teams and leaderboards are out of scope and every
   social hard boundary still stands (handoff §5.6, §5.9).
   ======================================================================= */

// 50 points across 6 years of adjustment. 50/6 = 8.333…; 8.33 is the constant
// locked in the design record, and the [0,100] clamp makes the endpoints exact
// on display (−6 → 99.98 → shows 100).
const SCORE_PER_YEAR = 8.33;

function computeScore(adjustment){
  if(adjustment==null || !isFinite(adjustment)) return null;
  return clamp(50 - adjustment*SCORE_PER_YEAR, 0, 100);
}

// Lever decomposition, in score points rather than years.
//
// ⚠ THE CLAMP TRAP. `ageAdjustments` clamps the TOTAL to ±6 but returns the
// PARTS UNCLAMPED. The worst case has parts summing to +6.52 against a clamped
// total of +6.00 — so a naive decomposition prints levers adding to a score of
// −4 underneath a headline of 0. Scale the parts proportionally when the clamp
// binds, and tell the reader it happened rather than hiding the discrepancy.
function scoreParts(parts, total){
  if(!parts || !parts.length) return { clamped:false, rows:[] };
  const raw = parts.reduce((a,p)=>a+p[1], 0);
  const clamped = Math.abs(raw-total) > 1e-9 && Math.abs(raw) > 1e-9;
  const k = clamped ? total/raw : 1;
  return {
    clamped, raw, total,
    rows: parts.map(([name, yrs])=>{
      const y = yrs*k;
      return { name, yrs:y, pts: -y*SCORE_PER_YEAR };   // +points = helping you
    }).sort((a,b)=> b.pts - a.pts)
  };
}

// Score at a given date, from the same 21-day window the age uses.
function scoreAt(date){
  const st = windowStats(date, 21);
  if(!st) return null;
  const a = ageAdjustments(st);
  return { score: computeScore(a.total), adjustment: a.total, parts: a.parts, n: st.n };
}

// Movement — the 30-day change. §5.8: competition runs on movement, never the
// absolute, because 35→48 is a harder month than 88→90. No new data: the same
// rescale evaluated 30 days back. A new user has no 30-day history, so this
// reports notReady rather than inventing a zero.
const SCORE_MATURE_DAYS = 14, SCORE_MOVE_DAYS = 30;
function scoreMovement(date){
  const now = scoreAt(date);
  if(!now) return null;
  const back = new Date(date+'T12:00:00'); back.setDate(back.getDate()-SCORE_MOVE_DAYS);
  const prevKey = dstr(back);
  const stPrev = windowStats(prevKey, 21);
  if(!stPrev || stPrev.n < SCORE_MATURE_DAYS){
    const have = stPrev ? stPrev.n : 0;
    return { now:now.score, ready:false, have };
  }
  const prev = computeScore(ageAdjustments(stPrev).total);
  return { now:now.score, prev, delta: now.score - prev, ready:true };
}

// Maturity gate — the same one the age uses. On day one the window is mostly
// template defaults, so a confident 87 would be a number the app has not earned.
// Withhold it until the age's own baseline gate passes.
function scoreReady(){ return confirmedDates().length >= SCORE_MATURE_DAYS; }

/* ---------- CIRCLES · SEASON 0 - the numbers a circle card carries ----------
   HEBE_CIRCLES_DESIGN.md §3-4, as amended for Season 0 (Kanish, 24 Sept 2026):
   - Season 0 ranks on CONSISTENCY, which works from day one. Movement is a
     second column that fills in per person once their score has history.
   - Only CONFIRMED days count - a daily check-in today; the weekly review later,
     which must stamp confirmedAt the same way - and only when confirmed within
     8 days of the date. Planned-only days never count.
   - A lever with no input on a day leaves that lever's denominator for that day:
     unknown is not a miss. A day you didn't log costs nothing.
   Pure reads. Nothing here writes a day and nothing here is engine; the score it
   quotes is the owner's own, and the engine is frozen for the season. -------- */
const SEASON_ONTIME_DAYS = 8, SEASON_RANK_MIN = 5, SEASON_MOVE_MIN_DAYS = 7;
const SEASON_LEVERS = ['Sleep','Training volume','Strength','Sitting','Food quality','Stress'];
const isNum = v => typeof v==='number' && isFinite(v);
function dayGap(a, b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5); }
// Confirmed, and confirmed within 8 days of its own date. A legacy day with no
// confirmedAt never counts - it predates the rule, so it cannot prove it.
function onTimeConfirmed(k){
  const d = S.days[k];
  if(!d || !(d.updatedAt>0) || !d.confirmedAt) return false;
  return dayGap(k, dstr(new Date(d.confirmedAt))) <= SEASON_ONTIME_DAYS;
}
function seasonDays(start, end){
  const last = end < todayStr() ? end : todayStr();
  return confirmedDates(last).filter(k => k >= start && onTimeConfirmed(k));
}
// On-target lines from the same published thresholds the levers use (§4).
// true / false, or null when the day holds no input for that lever. Resting HR
// is left out: it would rank genetics and fitness history, not this month.
function leverOnTarget(name, k){
  const d = S.days[k], m = (d && d.metrics) || {};
  switch(name){
    case 'Sleep': return isNum(m.sleepH) ? (m.sleepH>=7 && m.sleepH<=9) : null;
    case 'Training volume':
      if(!isNum(m.rideH) && !isNum(m.workoutMin)) return null;
      return ((m.rideH||0) + (m.workoutMin||0)/60) >= 0.7;
    case 'Strength': {
      if(typeof m.workoutDone!=='boolean') return null;
      // WHO >=2x/wk: on target when the trailing 7 days, this one included, hold 2+ lifting days
      let lifts = 0;
      for(let i=0;i<7;i++){
        const dt = new Date(k+'T12:00:00'); dt.setDate(dt.getDate()-i);
        const x = S.days[dstr(dt)];
        if(x && x.updatedAt>0 && x.metrics && x.metrics.workoutDone===true) lifts++;
      }
      return lifts >= 2;
    }
    case 'Sitting': return isNum(m.sitH) ? m.sitH<=8 : null;
    case 'Food quality': {
      const f = (d.foods||[]).filter(x=>isNum(x.score)).map(x=>x.score);
      return f.length ? (f.reduce((a,b)=>a+b,0)/f.length) >= 65 : null;
    }
    case 'Stress': return isNum(m.stress) ? m.stress<=4 : null;
  }
  return null;
}
function seasonConsistency(dates){
  let on = 0, n = 0; const per = {};
  SEASON_LEVERS.forEach(L=> per[L] = { on:0, n:0 });
  dates.forEach(k=> SEASON_LEVERS.forEach(L=>{
    const r = leverOnTarget(L, k); if(r===null) return;
    n++; per[L].n++; if(r){ on++; per[L].on++; }
  }));
  return { on, n, rate: n ? on/n : null, per };
}
// Movement from the first in-season day the score existed (14 confirmed days)
// to the latest in-season day, reported only once SEASON_MOVE_MIN_DAYS apart so
// a two-day wobble never reads as a result.
function seasonMovement(dates){
  const ready = dates.filter(k => confirmedDates(k).length >= SCORE_MATURE_DAYS);
  if(!ready.length) return { movement:null, from:null };
  const from = ready[0], to = dates[dates.length-1];
  if(dayGap(from, to) < SEASON_MOVE_MIN_DAYS) return { movement:null, from };
  const a = scoreAt(from), b = scoreAt(to);
  if(!a || !b || a.score==null || b.score==null) return { movement:null, from };
  return { movement: Math.round((b.score - a.score)*10)/10, from };
}
// Language-neutral so each reader renders it in their own language:
// t = training days per week, s = mean sleep hours, n = days it is built on.
function seasonPractice(dates){
  if(!dates.length) return '';
  let train = 0, sleep = 0, sn = 0;
  dates.forEach(k=>{ const m = S.days[k].metrics || {};
    if(m.workoutDone===true || (m.rideH||0) >= 0.25) train++;
    if(isNum(m.sleepH)){ sleep += m.sleepH; sn++; } });
  return 't='+Math.round(train/dates.length*7)+';s='+(sn ? (sleep/sn).toFixed(1) : '')+';n='+dates.length;
}
// The whole card, from local values. The score is included only when the owner
// opted in for this circle - the Firestore rules refuse it otherwise, too.
function seasonCard(start, end, showScore){
  const dates = seasonDays(start, end);
  const c = seasonConsistency(dates), mv = seasonMovement(dates);
  const sc = scoreReady() ? scoreAt(todayStr()) : null;
  const s = sc && sc.score!=null ? sc.score : null;
  return {
    band: s!=null ? scoreBandRow(s).k : 'forming',
    score: (showScore && s!=null) ? Math.round(s*10)/10 : null,
    consistency: c.rate==null ? null : Math.round(c.rate*1000)/1000,
    onTargetDays: c.on, leverDays: c.n, confirmedDays: dates.length,
    movement: mv.movement, movementFrom: mv.movement!=null ? mv.from : null,
    practiceLine: seasonPractice(dates),
    provenance: scoreProvenance(todayStr()).key,
    updatedAt: Date.now()
  };
}


/* ---------- USUAL MEALS + THE PLAN READER (HEBE_WEEKLY_MODE.md 1, 9.1) -----
   Nobody logs every day, so food gets planned instead of recalled. A usual meal
   is a NAMED SNAPSHOT OF FOOD ENTRIES - the exact objects `foods[]` already
   holds, produced by the Fuel UI that already exists.

   That choice is the whole design: no new entry screen, no new scorer, no new
   food shape. You log a meal the way you log food today, tap "Save as a usual
   meal", and every downstream reader - nutritionCoverage, dayNutrition, the
   Food quality lever, the Fuel list - keeps working, because the entries are
   byte-identical to logged ones.

   Scored once, by the scorer that produced the entries (the local heuristic
   when there is no API key, which is every stranger's case). Never re-scored.

   MEAL EDITS ARE RETROACTIVE inside the 8-day horizon (owner decision, 22 Sept
   2026): planned days are derived, so editing a meal changes every unreviewed
   day that uses it. The UI says so out loud. Confirmed days keep their
   snapshot, because confirming writes the foods onto the day.
   ------------------------------------------------------------------------- */

// The review horizon. 8, not 14: the window is 21 days, so a 14-day horizon
// would let two thirds of the headline number be intention rather than record.
// 8 caps it at 38% and matches both the weekly rhythm and the circles rule.
const PLAN_HORIZON = 8;

function usualMeals(){ return S.meals || (S.meals = {}); }
function usualMealList(){
  return Object.values(usualMeals()).sort((a,b)=> (a.name||'').localeCompare(b.name||''));
}
function mealId(){ return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// Mean of the entries that carry a quality score. Whole foods deliberately
// carry none (NOVA 1 by definition), so this measures the processed part - the
// same rule the daily food average already follows.
function mealScore(meal){
  const sc = (meal.foods||[]).filter(f=>typeof f.score==='number').map(f=>f.score);
  return sc.length ? Math.round(sc.reduce((a,b)=>a+b,0)/sc.length) : null;
}
// Unknown is not zero (handoff 10, nutrition rule 2). Named-only entries carry
// no weight and no macros, so a meal built from them reports null rather than a
// fabricated 0 that would read as "this meal has no protein".
function mealMacros(meal){
  let kcal=null, protein=null;
  (meal.foods||[]).forEach(f=>{
    const g = f.grams||0;
    if(f.kcal!=null)    kcal    = (kcal||0)    + (g? f.kcal*g/100    : f.kcal);
    if(f.protein!=null) protein = (protein||0) + (g? f.protein*g/100 : f.protein);
  });
  return { kcal: kcal==null? null : Math.round(kcal),
           protein: protein==null? null : Math.round(protein) };
}
function saveUsualMeal(name, foods){
  const list = (foods||[]).map(f=>Object.assign({}, f));   // snapshot, not a reference
  if(!list.length) return null;
  const id = mealId();
  const meal = { id, name:(name||'').trim() || t('um_untitled'), foods:list,
                 createdAt:Date.now(), updatedAt:Date.now() };
  meal.score = mealScore(meal);
  const mac = mealMacros(meal); meal.kcal = mac.kcal; meal.protein = mac.protein;
  usualMeals()[id] = meal;
  persist(); pushSettings();
  return meal;
}
function updateUsualMeal(id, patch){
  const m = usualMeals()[id]; if(!m) return null;
  Object.assign(m, patch, { updatedAt:Date.now() });
  m.score = mealScore(m);
  const mac = mealMacros(m); m.kcal = mac.kcal; m.protein = mac.protein;
  persist(); pushSettings();
  return m;
}
function deleteUsualMeal(id){
  if(!usualMeals()[id]) return;
  delete usualMeals()[id];
  // A deleted meal must not linger in the plan, or plannedMealIdsFor would keep
  // filtering it out silently on every read.
  const weeks = planWeeks();
  Object.keys(weeks).forEach(wk=> Object.keys(weeks[wk]).forEach(dt=>{
    weeks[wk][dt] = (weeks[wk][dt]||[]).filter(x=>x!==id); }));
  const tpl = planMealTpl();
  tpl.weekday = (tpl.weekday||[]).filter(x=>x!==id);
  tpl.weekend = (tpl.weekend||[]).filter(x=>x!==id);
  persist(); pushSettings();
}

// ---- the plan reader (the planner UI lands in the next commit) ----
// Weeks are keyed by their Monday, which sorts correctly and needs no ISO-week
// arithmetic.
function weekKey(date){
  const d = new Date(date+'T12:00:00');
  const dow = (d.getDay()+6)%7;             // Mon=0 .. Sun=6
  d.setDate(d.getDate()-dow);
  return dstr(d);
}
function planWeeks(){ if(!S.plan) S.plan={}; return S.plan.weeks || (S.plan.weeks = {}); }
function planMealTpl(){ if(!S.plan) S.plan={}; return S.plan.mealTpl || (S.plan.mealTpl = {weekday:[],weekend:[]}); }

// Meal ids planned for a date: the week's explicit plan if there is one, else
// the meal template for that day type. A fasting-protocol day is empty by
// construction, the same way ensureDay already zeroes its protein.
function plannedMealIdsFor(date){
  const proto = activeProtocol(date);
  if(proto && proto.type==='fasting') return [];
  const wk = planWeeks()[weekKey(date)];
  if(wk && wk[date]) return wk[date].filter(id=>usualMeals()[id]);
  const tpl = planMealTpl()[templateFor(date)] || [];
  return tpl.filter(id=>usualMeals()[id]);
}
// Dates inside the horizon with no confirmed record. The generator IS the
// expiry: outside PLAN_HORIZON nothing is produced, so a stale plan cannot keep
// propping the number up and no sweep is needed.
function plannedDatesRaw(before){
  const end = before || todayStr(), out = [];
  for(let i=0;i<PLAN_HORIZON;i++){
    const dt = new Date(end+'T12:00:00'); dt.setDate(dt.getDate()-i);
    const k = dstr(dt);
    if(k > todayStr()) continue;                        // never plan the future in
    if(S.days[k] && S.days[k].updatedAt>0) continue;    // confirmed always wins
    out.push(k);
  }
  return out.reverse();
}
// How many unreviewed days inside the horizon currently use this meal. Shown on
// edit and delete so the retroactive effect is stated, never silent.
function mealPlannedUses(id){
  let n = 0;
  plannedDatesRaw().forEach(k=>{ if(plannedMealIdsFor(k).indexOf(id)>=0) n++; });
  return n;
}

function usualMealsHTML(){
  const list = usualMealList();
  const d = ensureDay(S.date);
  const n = (d.foods||[]).length;
  let h = '<div class="card mt fade" id="usualMealsCard">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
    +   '<h3>'+t('um_title')+'</h3>'
    +   (n ? '<button class="btn primary" id="umSave" style="font-size:12px;padding:6px 12px">'+t('um_saveToday', n)+'</button>'
          : '<span class="sub2">'+t('um_saveHint')+'</span>')
    + '</div>';
  if(!list.length){
    h += '<div class="sub" style="margin-top:9px;line-height:1.55">'+t('um_empty')+'</div>';
    return h + '</div>';
  }
  h += '<div class="mealList">';
  list.forEach(m=>{
    const uses = mealPlannedUses(m.id);
    h += '<div class="mealRow">'
      + '<div class="mn"><b>'+esc(m.name)+'</b>'
      +   '<div class="sub2">'+(m.foods||[]).length+' '+t('um_items')
      +     (m.protein? ' \u00b7 '+m.protein+'g '+t('um_protein'):'')
      +     (m.kcal? ' \u00b7 '+m.kcal+' kcal':'')
      +     (uses? ' \u00b7 '+t('um_usedIn', uses):'')+'</div></div>'
      + '<span class="ms">'+(m.score!=null? m.score+'<i>/100</i>' : '<i>'+t('um_wholeFood')+'</i>')+'</span>'
      + '<button class="btn" data-mealren="'+m.id+'" style="font-size:11px;padding:4px 9px">'+t('um_rename')+'</button>'
      + '<button class="btn" data-mealdel="'+m.id+'" style="font-size:11px;padding:4px 9px">'+t('um_delete')+'</button>'
      + '</div>';
  });
  h += '</div>';
  h += '<div class="sub" style="font-size:10.5px;margin-top:10px;line-height:1.45">'+t('um_foot')+'</div>';
  return h + '</div>';
}

/* ---------- THE WEEK PLANNER (HEBE_WEEKLY_MODE.md 2, 9.2) ------------------
   Fuel -> "Plan the week". Seven days, each pre-filled from the weekday or
   weekend meal template; fasting-protocol days empty and locked; one tap to
   repeat last week; any slot swappable for another usual meal.

   Planning is optional: with no explicit plan the meal templates ARE the plan
   (plannedMealIdsFor already falls back to them). Every edit writes to S.plan
   only - never to a day doc - so nothing here can bump updatedAt.
   ------------------------------------------------------------------------- */
let planWeekOffset = 0;                      // 0 = this week, 1 = next week
function planWeekDates(offset){
  const mon = new Date(weekKey(todayStr())+'T12:00:00');
  mon.setDate(mon.getDate() + 7*(offset||0));
  const out = [];
  for(let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); out.push(dstr(d)); }
  return out;
}
function planIsFast(date){ const p = activeProtocol(date); return !!(p && p.type==='fasting'); }
function planHasExplicit(date){ const wk = planWeeks()[weekKey(date)]; return !!(wk && wk[date]); }
// Editing a day that still follows the template first copies the template's
// list onto the day, so a single swap never silently drops the other meals.
function planDayList(date){
  const wks = planWeeks(), k = weekKey(date);
  if(!wks[k]) wks[k] = {};
  if(!wks[k][date]) wks[k][date] = plannedMealIdsFor(date).slice();
  return wks[k][date];
}
function planSave(){ persist(); pushSettings(); }
function setPlanSlot(date, idx, id){
  if(planIsFast(date)) return;
  const list = planDayList(date);
  if(id) list[idx] = id; else list.splice(idx, 1);
  planSave();
}
function addPlanSlot(date, id){
  if(planIsFast(date) || !id) return;
  planDayList(date).push(id); planSave();
}
// Copy the EFFECTIVE plan of the previous week (explicit or template) onto
// this week. Fast days stay empty whatever last week held.
function repeatLastWeek(offset){
  const cur = planWeekDates(offset), prev = planWeekDates((offset||0)-1);
  const wks = planWeeks();
  cur.forEach((d,i)=>{
    const k = weekKey(d); if(!wks[k]) wks[k] = {};
    wks[k][d] = planIsFast(d) ? [] : plannedMealIdsFor(prev[i]).slice();
  });
  planSave();
}
function clearWeekPlan(offset){
  const k = weekKey(planWeekDates(offset)[0]);
  delete planWeeks()[k]; planSave();
}
function setTplSlot(kind, idx, id){

/* ---------- provenance (HEBE_SCORE_V2.md §2.3, D3 un-deferred) -------------
   Every day carries a source, and the score shows it. This has to exist before
   anyone is ranked against anyone: a self-reported 80 and a sensor-backed 80
   are not the same claim, and a board that hides the difference is a board that
   rewards optimistic typing.

   Today HEBE has no device path — Apple Health import and vendor OAuth are both
   unbuilt (handoff §11) — so every day is self-reported and the surface says
   exactly that. Nothing here pretends otherwise.

   DERIVED, NEVER STORED. A side feature that wrote provenance into a day doc
   would bump updatedAt and mark an unlogged day as logged, which is the bug
   class handoff §4 hazard 1 exists to prevent. The reader already honours the
   markers a future import will set, so that import needs no migration:
       d.provenance    === 'sensor'   — the whole day came from a device
       d.wearable.src  === 'sensor'   — the wearable block did
   ------------------------------------------------------------------------- */
const PROV = { SELF:'self-reported', SENSOR:'sensor', MIXED:'mixed' };
function dayProvenance(date){
  const d = S.days[date];
  if(!d) return PROV.SELF;
  if(d.provenance === PROV.SENSOR) return PROV.SENSOR;
  if(d.wearable && d.wearable.src === PROV.SENSOR) return PROV.SENSOR;
  return PROV.SELF;
}
// Provenance of the score itself — of the 21-day window it is computed from,
// not of today alone, because that window is what the number actually is.
function scoreProvenance(date){
  const dates = confirmedDates(date).slice(-21);
  if(!dates.length) return { key:PROV.SELF, sensorDays:0, n:0 };
  const sensor = dates.filter(k=>dayProvenance(k)===PROV.SENSOR).length;
  return { key: sensor===0 ? PROV.SELF : sensor===dates.length ? PROV.SENSOR : PROV.MIXED,
           sensorDays: sensor, n: dates.length };
}
function provenanceLabel(p){
  return p.key===PROV.SENSOR ? t('pv_sensor')
       : p.key===PROV.MIXED  ? t('pv_mixed', p.sensorDays, p.n)
       : t('pv_self');
}
function provenanceTagHTML(date){
  const p = scoreProvenance(date);
  return '<span class="provtag '+(p.key===PROV.SELF?'self':'sensor')+'" title="'+esc(t('pv_why'))+'">'
    + esc(provenanceLabel(p))+'</span>';
}

/* ---------- score v2 · phase 1 · the score as the hero -------------------
   HEBE_SCORE_V2.md §2. Owner decision 22 Sept 2026: the score is the main
   feature. It takes the hero slot and the HEBE age moves directly beneath it
   as the explanation — the age is NOT removed, and it keeps its own element
   ids, its count-up and its trend badge.

   Points are the score's own unit (years × 8.33, from published coefficients),
   never an awarded currency. Handoff §5.5 was amended for exactly this reading:
   nothing here is earned, accumulated or spent, and a missed day still costs
   nothing. No streaks, no badges, no guilt-on-miss.
   ------------------------------------------------------------------------ */

// Bands as a table so the label and the next-band gradient can never disagree.
const SCORE_BANDS = [
  { min:85, k:'sb_floor'   },
  { min:70, k:'sb_most'    },
  { min:55, k:'sb_ahead'   },
  { min:45, k:'sb_neutral' },
  { min:30, k:'sb_few'     },
  { min:0,  k:'sb_room'    }
];
function scoreBandRow(s){ return SCORE_BANDS.find(b=> s>=b.min) || SCORE_BANDS[SCORE_BANDS.length-1]; }
// Descriptive of the model's own output, never a verdict about the person.
function scoreBand(s){ return t(scoreBandRow(s).k); }
// Goal gradient. Hidden in the top band — "every lever near its floor" is the
// ceiling by construction, so there is nothing honest to point at above it.
function scoreNextBand(s){
  const i = SCORE_BANDS.indexOf(scoreBandRow(s));
  if(i<=0) return null;
  const up = SCORE_BANDS[i-1];
  return { label: t(up.k), gap: Math.max(0, up.min - s) };
}

// Weekly movement for the hero. The 30-day figure (scoreMovement) still drives
// the Reports panel; this is the same rescale over 7 days.
const SCORE_WEEK_DAYS = 7;
function scoreMovementWeek(date){
  const now = scoreAt(date);
  if(!now) return null;
  const back = new Date(date+'T12:00:00'); back.setDate(back.getDate()-SCORE_WEEK_DAYS);
  const stPrev = windowStats(dstr(back), 21);
  if(!stPrev || stPrev.n < SCORE_MATURE_DAYS) return { ready:false };
  const prev = computeScore(ageAdjustments(stPrev).total);
  return { ready:true, prev, delta: now.score - prev };
}

// Which lever moved most between two decompositions — used to attribute the
// check-in reveal to something the user actually did.
function scoreTopMover(prevParts, nowParts){
  if(!prevParts || !nowParts) return null;
  const prev = {}; prevParts.forEach(([n,v])=>{ prev[n]=v; });
  let best=null, bestAbs=0;
  nowParts.forEach(([n,v])=>{
    const d = Math.abs(v - (prev[n]||0));
    if(d > bestAbs){ bestAbs=d; best=n; }
  });
  return bestAbs > 0.005 ? best : null;
}

// Set by applyCheckin, consumed once by homeCharts. The reveal is the moment
// the number answers back, so it animates from yesterday's value rather than
// from the generic count-up start.
let scoreReveal = null;

// The age line beneath the score. Shared by the renderer and the count-up so
// the two can never disagree mid-animation.
function ageDeltaText(v, chrono){
  return v<=chrono ? t('sc_younger',(chrono-v).toFixed(2)) : t('sc_older',(v-chrono).toFixed(2));
}

// ---- the hero itself ----
function scoreHeroHTML(age, chrono, ageBadge){
  const s = scoreAt(S.date);

  const v = s.score, nb = scoreNextBand(v), wk = scoreMovementWeek(S.date);

    + '<div class="scorehero">'

          + (wk.delta>=-0.05?ICONS.up:ICONS.down)+' '+(wk.delta>=0?'+':'')+wk.delta.toFixed(1)+' '+t('sc_thisWeek')+'</span>'
        : '<span class="badge gray">'+t('sc_weekPending')+'</span>')

    + '</div>';
  if(scoreReveal){

      + (steady ? t('sc_holding')

      + '<span class="sp '+(pos?'pos':neg?'neg':'zero')+'">'+(pos?'+':'')+r.pts.toFixed(1)+'</span>'

    + 'over the same 21-day window. Positive is helping you.';

    h += ' <b>The ±6-year cap is binding</b>, so the levers are shown scaled to the capped total '
      + '(raw sum '+dec.raw.toFixed(2)+'y against a capped '+dec.total.toFixed(2)+'y). '
      + 'Unscaled they would add to a score the headline never shows.';

  h += '</div>';
  h += '<div class="sub" style="font-size:10.5px;margin-top:8px;line-height:1.45"><b>'+esc(t('pv_line'))+'.</b> '

    + 'days, not measured. Private to this device — HEBE has no sharing, no circles and no leaderboard.</div>';
  return h + '</div>';
}

/* =======================================================================
   BODY MAP — the layered body surface
   -----------------------------------------------------------------------
   Five separated layers, so this can grow without the render code changing:

     1 · ANATOMY REGISTRY   BODY_REGIONS  — what can be drawn (pure geometry)
     2 · STIMULUS MAP       WORKOUT_MAP   — what a logged session touches
     3 · SYSTEM REGISTRY    BODY_SYSTEMS  — the layers, and how each is sourced
     4 · SIGNAL LAYER       bodyState()   — pure read of S.days -> region values
     5 · PAINT + RENDER     bodyPaint / bodySvg / bodyRepaint

   Adding a muscle = one row in BODY_REGIONS. Adding a whole system = one row
   in BODY_SYSTEMS with a signal function. Neither touches the renderer.

   THREE RULES THIS FILE IS BUILT AROUND (handoff §4, §5, §6):

   a) IT NEVER WRITES. Every function here is a pure read of S.days. A side
      feature that touches a day doc bumps updatedAt, which marks an unlogged
      day as logged and biases the HEBE-age window. The body map has no write
      path at all — not even a debounced one.

   b) IT MAPS THE LOG, NOT THE BODY. A region's value is "how much logged work
      landed here", never inferred tissue state. The organ system is present
      and LOCKED on purpose: behaviour cannot infer ALT or HbA1c, and the lock
      is the motivating surface, not a missing feature.

   c) THE INTERACTION IS REAL-TIME; THE DATA CADENCE IS NOT. Scrub, hover,
      layer switch and replay all recompute instantly. But muscle and fat move
      over weeks, so the default window is 7 days and the replay steps in days
      across a 60-day record. Nothing here claims your body changed today.
   ======================================================================= */
